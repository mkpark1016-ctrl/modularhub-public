# Verification rerun with Playwright browser installed.
name: Verify Phase 8B-1 implementation

on:
  push:
    branches:
      - fix/company-type-first-discovery-and-financial-comparison

permissions:
  contents: read

env:
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest jsonschema

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Validate derived builders
        run: |
          python scripts/build_company_report_insights.py --base-ref origin/main --check
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-09
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-09 --check

      - name: Python tests
        run: |
          python -m pytest -q tests/test_company_report_insights.py
          python -m pytest -q
          python -m compileall scripts src

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm run test:companies
          npm run test:companies-detail
          npm run test:companies-comparison
          npm run test:companies-url
          npm run test:companies-v2
          npm run test:companies-projects
          npm run test:business
          npm run test:news
          npm run lint
          npm run build

      - name: Browser QA
        working-directory: frontend
        run: |
          npm run qa:browser
          npm run qa:company-intelligence-workspace

      - name: Diff quality
        run: git diff --check origin/main...HEAD
