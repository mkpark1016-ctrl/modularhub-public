name: General Contractor Working Capital Discovery QA

on:
  push:
    branches:
      - feat/general-contractor-working-capital-foundation

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: |
          python -m pytest -q tests/test_general_contractor_working_capital_discovery.py tests/test_general_contractor_dart_audit_adapter.py
          python -m compileall scripts src
          git diff --check

  discovery:
    needs: unit
    name: ${{ matrix.company }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        company:
          - gs-ec
          - samsung-ct-construction
          - hyundai-engineering
          - dl-enc
    env:
      OPENDART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Discover consolidated accounts
        run: |
          python scripts/discover_general_contractor_working_capital_accounts.py \
            --companies "${{ matrix.company }}" \
            --output-dir artifacts/discovery
      - uses: actions/upload-artifact@v4
        with:
          name: working-capital-discovery-${{ matrix.company }}
          path: artifacts/discovery/*.json
          retention-days: 7
