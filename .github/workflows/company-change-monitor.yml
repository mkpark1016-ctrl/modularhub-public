name: Company Change Monitor

on:
  schedule:
    # GitHub cron uses UTC. 23:10 UTC is 08:10 KST for the daily 2-day signal scan.
    - cron: "10 23 * * *"
    # GitHub cron uses UTC. 23:40 UTC Saturday is 08:40 KST Sunday for the weekly 30-day scan.
    - cron: "40 23 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily_signals"
        type: choice
        options:
          - daily_signals
          - weekly_research
          - full_audit
      companies:
        description: "Comma-separated company IDs; blank means all 11"
        required: false
        default: ""
        type: string
      sources:
        description: "Comma-separated source IDs"
        required: true
        default: "public_news,naver_api_hub,dart"
        type: string
      lookback_days:
        description: "Signal lookback window"
        required: true
        default: "30"
        type: string
      create_proposal:
        description: "Create proposal metadata only when acknowledge_proposal is also true"
        required: true
        default: false
        type: boolean
      acknowledge_proposal:
        description: "Explicitly acknowledge proposal generation"
        required: true
        default: false
        type: boolean
      acknowledge_live:
        description: "Acknowledge configured source checks and live-capable source isolation"
        required: true
        default: false
        type: boolean

concurrency:
  group: company-change-monitor-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
      NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Guard inputs
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          POLICY="config/company_change_monitoring/operations_policy.json"
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "10 23 * * *" ]]; then
            RUN_KIND="daily"
            MODE=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['daily']['mode'])")
            COMPANIES=""
            SOURCES=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['daily']['sources'])")
            LOOKBACK=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['daily']['lookbackDays'])")
            ACKNOWLEDGE_LIVE="true"
            CREATE_PROPOSAL="false"
            ACKNOWLEDGE_PROPOSAL="false"
            ARTIFACT_RETENTION_DAYS=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['artifactRetentionDays']['daily'])")
          elif [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "40 23 * * 6" ]]; then
            RUN_KIND="weekly"
            MODE=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['weekly']['mode'])")
            COMPANIES=""
            SOURCES=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['weekly']['sources'])")
            LOOKBACK=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['weekly']['lookbackDays'])")
            ACKNOWLEDGE_LIVE="true"
            CREATE_PROPOSAL="false"
            ACKNOWLEDGE_PROPOSAL="false"
            ARTIFACT_RETENTION_DAYS=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['artifactRetentionDays']['weekly'])")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RUN_KIND="manual"
            MODE="${{ inputs.mode }}"
            COMPANIES="${{ inputs.companies }}"
            SOURCES="${{ inputs.sources }}"
            LOOKBACK="${{ inputs.lookback_days }}"
            ACKNOWLEDGE_LIVE="${{ inputs.acknowledge_live }}"
            CREATE_PROPOSAL="${{ inputs.create_proposal }}"
            ACKNOWLEDGE_PROPOSAL="${{ inputs.acknowledge_proposal }}"
            ARTIFACT_RETENTION_DAYS=$(python -c "import json; print(json.load(open('$POLICY', encoding='utf-8'))['artifactRetentionDays']['manual'])")
          else
            echo "Unsupported Company Change Monitor trigger: event=$EVENT_NAME schedule=$EVENT_SCHEDULE" >&2
            exit 2
          fi
          PUBLISH="false"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$CREATE_PROPOSAL" == "true" && "$ACKNOWLEDGE_PROPOSAL" != "true" ]]; then
            echo "create_proposal requires acknowledge_proposal=true" >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$ACKNOWLEDGE_LIVE" != "true" ]]; then
            echo "acknowledge_live=true is required before live-capable source checks" >&2
            exit 2
          fi
          if [[ "$COMPANIES" != "" ]]; then
            echo "Manual scoped run detected; scheduled runs keep companies blank to use all 11."
          fi
          echo "run_kind=$RUN_KIND" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "companies=$COMPANIES" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "lookback_days=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "acknowledge_live=$ACKNOWLEDGE_LIVE" >> "$GITHUB_OUTPUT"
          echo "create_proposal=$CREATE_PROPOSAL" >> "$GITHUB_OUTPUT"
          echo "acknowledge_proposal=$ACKNOWLEDGE_PROPOSAL" >> "$GITHUB_OUTPUT"
          echo "artifact_retention_days=$ARTIFACT_RETENTION_DAYS" >> "$GITHUB_OUTPUT"
          echo "run_kind: $RUN_KIND"
          echo "mode: $MODE"
          echo "companies: ${COMPANIES:-<all 11>}"
          echo "sources: $SOURCES"
          echo "lookback_days: $LOOKBACK"
          echo "artifact_retention_days: $ARTIFACT_RETENTION_DAYS"
          echo "acknowledge_live: ${ACKNOWLEDGE_LIVE:-false}"
          echo "publish: $PUBLISH"
          echo "create_proposal: ${CREATE_PROPOSAL:-false}"
          echo "acknowledge_proposal: ${ACKNOWLEDGE_PROPOSAL:-false}"
          echo "DART_API_KEY configured: $([[ -n "${DART_API_KEY:-}" ]] && echo true || echo false)"
          echo "NAVER_API_HUB_CLIENT_ID configured: $([[ -n "${NAVER_API_HUB_CLIENT_ID:-}" ]] && echo true || echo false)"
          echo "NAVER_API_HUB_CLIENT_SECRET configured: $([[ -n "${NAVER_API_HUB_CLIENT_SECRET:-}" ]] && echo true || echo false)"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip show pytest

      - name: Compile Python sources
        run: python -m compileall scripts src

      - name: Run company change monitoring tests
        run: |
          python -m pytest \
            tests/test_company_change_monitoring.py \
            tests/test_company_data_quality.py \
            tests/test_dart_identity_resolution.py \
            tests/test_company_source_coverage.py \
            tests/test_dart_company_identity_registry.py \
            tests/test_public_news_empty_diagnostics.py \
            tests/test_source_concentration_policy.py \
            -q

      - name: Validate DART identity registry
        run: python scripts/validate_dart_identity_registry.py

      - name: Collect live company change sources and build review queue
        id: build
        shell: bash
        run: |
          set +e
          MODE="${{ steps.guard.outputs.mode }}"
          COMPANIES="${{ steps.guard.outputs.companies }}"
          SOURCES="${{ steps.guard.outputs.sources }}"
          LOOKBACK="${{ steps.guard.outputs.lookback_days }}"
          ACK_LIVE="${{ steps.guard.outputs.acknowledge_live }}"
          PUBLISH="false"
          python scripts/company_change_monitoring/build_change_review_queue.py \
            --mode "$MODE" \
            --companies "$COMPANIES" \
            --sources "$SOURCES" \
            --lookback-days "$LOOKBACK" \
            --live \
            $([[ "$ACK_LIVE" == "true" ]] && echo "--acknowledge-live")
          BUILD_EXIT=$?
          set -e
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          echo "build_exit_code=$BUILD_EXIT"
          exit 0

      - name: Audit candidates
        id: audit
        if: always()
        shell: bash
        run: |
          set +e
          python scripts/audit_company_change_candidates.py
          AUDIT_EXIT=$?
          set -e
          echo "exit_code=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
          echo "audit_exit_code=$AUDIT_EXIT"
          exit 0

      - name: Audit source coverage
        id: source_coverage
        if: always()
        shell: bash
        run: |
          set +e
          python scripts/audit_company_source_coverage.py --head-sha "${{ github.sha }}"
          COVERAGE_EXIT=$?
          set -e
          echo "exit_code=$COVERAGE_EXIT" >> "$GITHUB_OUTPUT"
          echo "source_coverage_exit_code=$COVERAGE_EXIT"
          exit 0

      - name: Protected public data unchanged
        id: protected
        if: always()
        shell: bash
        run: |
          set +e
          git diff --exit-code -- frontend/public/data/news.json frontend/public/data/business.json frontend/public/data/meta.json frontend/public/data/companies/companies.json frontend/public/data/companies/company_intelligence_v2.json
          PROTECTED_EXIT=$?
          set -e
          echo "exit_code=$PROTECTED_EXIT" >> "$GITHUB_OUTPUT"
          echo "protected_exit_code=$PROTECTED_EXIT"
          exit 0

      - name: Secret exposure scan
        id: secret_scan
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          blocked = ["DART_API_KEY=", "NAVER_API_HUB_CLIENT_SECRET=", "Authorization:", "request_headers", "raw_response"]
          paths = [
              *Path("reports/company_change_monitoring").glob("*"),
              *Path("artifacts/company-change-monitor").glob("*"),
              *Path("artifacts/company-source-coverage").glob("*"),
          ]
          text = "\n".join(path.read_text(encoding="utf-8", errors="ignore") for path in paths if path.is_file())
          hits = [item for item in blocked if item in text]
          if hits:
              raise SystemExit(f"secret_exposure_detected: true")
          print("secret_exposure_detected: false")
          PY
          SECRET_EXIT=$?
          set -e
          echo "exit_code=$SECRET_EXIT" >> "$GITHUB_OUTPUT"
          echo "secret_scan_exit_code=$SECRET_EXIT"
          exit 0

      - name: Evaluate operations
        id: operations
        if: always()
        shell: bash
        run: |
          set +e
          python scripts/evaluate_company_change_operations.py \
            --run-kind "${{ steps.guard.outputs.run_kind }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --run-sha "${{ github.sha }}" \
            --workflow-event "${{ github.event_name }}"
          OPS_EXIT=$?
          set -e
          echo "exit_code=$OPS_EXIT" >> "$GITHUB_OUTPUT"
          echo "operations_exit_code=$OPS_EXIT"
          exit 0

      - name: Publish operations alert
        id: operations_alert
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/company_change_operations_alert.py
          ALERT_EXIT=$?
          set -e
          echo "exit_code=$ALERT_EXIT" >> "$GITHUB_OUTPUT"
          echo "operations_alert_exit_code=$ALERT_EXIT"
          exit 0

      - name: Write summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          queue_path = Path("data/company_change_monitoring/review_queue.json")
          audit_path = Path("artifacts/company-change-monitor/audit-summary.json")
          coverage_path = Path("artifacts/company-source-coverage/source-coverage-report.json")
          operations_path = Path("artifacts/company-change-monitor/operations-evaluation.json")
          alert_path = Path("artifacts/company-change-monitor/operations-alert.json")
          print("## Company Change Monitor")
          if not queue_path.exists() or not audit_path.exists():
              print("- Artifact status: `missing required build or audit outputs`")
              raise SystemExit(0)
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          operations = json.loads(operations_path.read_text(encoding="utf-8")) if operations_path.exists() else {}
          coverage = json.loads(coverage_path.read_text(encoding="utf-8")) if coverage_path.exists() else {}
          alert = json.loads(alert_path.read_text(encoding="utf-8")) if alert_path.exists() else {}
          run_kind = operations.get("runMetadata", {}).get("runKind", "${{ steps.guard.outputs.run_kind }}")
          print(f"- Run kind: `{run_kind}`")
          print(f"- Run ID: `{queue['runId']}`")
          print(f"- Companies: `{len(queue['companies'])}`")
          print(f"- Candidates: `{queue['candidateCount']}`")
          print(f"- Pending: `{queue['pending']}`")
          print(f"- Duplicate: `{queue['duplicate']}`")
          print(f"- Conflict: `{queue['conflict']}`")
          print(f"- Insufficient evidence: `{queue['insufficientEvidence']}`")
          print(f"- Rejected: `{queue.get('rejected', 0)}`")
          print(f"- High priority: `{queue['highPriority']}`")
          print(f"- Audit valid: `{audit['valid']}`")
          print(f"- Candidate IDs unique: `{audit.get('candidateIdUnique')}`")
          print(f"- Status conservation: `{audit.get('statusConservationPassed')}`")
          print(f"- Orphan duplicate refs: `{audit.get('orphanDuplicateReferenceCount')}`")
          print(f"- Orphan conflict refs: `{audit.get('orphanConflictReferenceCount')}`")
          print(f"- Multi-status candidates: `{audit.get('multiStatusCandidateCount')}`")
          print(f"- Secret exposure: `{audit['secretExposureDetected']}`")
          print(f"- Public data changed: `{audit['publicDataChanged']}`")
          print(f"- Operations state: `{operations.get('state', 'missing')}`")
          print(f"- Source coverage state: `{coverage.get('state', 'missing')}`")
          print(f"- Source coverage warnings: `{','.join(coverage.get('warningCodes', [])) or 'none'}`")
          print(f"- Source coverage failures: `{','.join(coverage.get('failureCodes', [])) or 'none'}`")
          print(f"- DART identity coverage: `{coverage.get('dartMappingCoverage', {}).get('percent', 'missing')}`")
          print(f"- Alert action: `{alert.get('action', 'none')}`")
          print(f"- Alert code: `{alert.get('alertCode', 'none')}`")
          print("### Sources")
          for source in queue["sourceStatuses"]:
              print(f"- `{source['sourceId']}`: {source['state']} / configured={source['configured']} / attempted={source.get('attempted')} / raw={source['rawCount']} / normalized={source['normalizedCount']} / error={source.get('safeErrorCategory')}")
          print("### Artifacts")
          if operations:
              for name, status in operations.get("artifacts", {}).items():
                  print(f"- `{name}`: exists={status.get('exists')} / size={status.get('sizeBytes')} / parseable={status.get('parseable')}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-raw-summary
          path: artifacts/company-change-monitor/raw-summary.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-normalized
          path: artifacts/company-change-monitor/normalized-signals.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-review-queue
          path: data/company_change_monitoring/review_queue.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-digest
          path: reports/company_change_monitoring/
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-audit
          path: |
            artifacts/company-change-monitor/audit-*
            artifacts/company-change-monitor/operations-evaluation.json
            artifacts/company-change-monitor/operations-alert.json
            reports/company_change_monitoring/latest_operations_evaluation.md
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-change-classification-diagnostics
          path: artifacts/company-change-monitor/classification-diagnostics.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-source-coverage
          path: |
            artifacts/company-source-coverage/source-coverage-report.json
            artifacts/company-source-coverage/source-coverage-report.md
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-dart-identity-coverage
          path: artifacts/company-source-coverage/dart-mapping-report.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-public-news-diagnostics
          path: artifacts/company-source-coverage/public-news-empty-diagnostics.json
          retention-days: ${{ steps.guard.outputs.artifact_retention_days || 30 }}

      - name: Final acceptance gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          failures = []
          if "${{ steps.build.outputs.exit_code }}" != "0":
              failures.append("generation_failed")
          if "${{ steps.audit.outputs.exit_code }}" != "0":
              failures.append("audit_step_failed")
          if "${{ steps.source_coverage.outputs.exit_code }}" != "0":
              failures.append("source_coverage_step_failed")
          if "${{ steps.protected.outputs.exit_code }}" != "0":
              failures.append("public_data_changed")
          if "${{ steps.secret_scan.outputs.exit_code }}" != "0":
              failures.append("secret_exposure")
          if "${{ steps.operations.outputs.exit_code }}" != "0":
              failures.append("operations_failed")

          required = [
              Path("artifacts/company-change-monitor/raw-summary.json"),
              Path("artifacts/company-change-monitor/normalized-signals.json"),
              Path("data/company_change_monitoring/review_queue.json"),
              Path("reports/company_change_monitoring/latest_digest.json"),
              Path("artifacts/company-change-monitor/audit-summary.json"),
              Path("artifacts/company-change-monitor/classification-diagnostics.json"),
              Path("artifacts/company-change-monitor/operations-evaluation.json"),
              Path("artifacts/company-source-coverage/source-coverage-report.json"),
              Path("artifacts/company-source-coverage/dart-mapping-report.json"),
              Path("artifacts/company-source-coverage/public-news-empty-diagnostics.json"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              failures.append("missing_artifacts")
          else:
              audit = json.loads(Path("artifacts/company-change-monitor/audit-summary.json").read_text(encoding="utf-8"))
              if not audit.get("valid"):
                  failures.append("audit_invalid")
              for key in [
                  "orphanDuplicateReferenceCount",
                  "orphanConflictReferenceCount",
                  "duplicateOfSelfCount",
                  "conflictSelfReferenceCount",
                  "duplicateReferenceCycleCount",
                  "multiStatusCandidateCount",
                  "crossCompanyContaminationCount",
              ]:
                  if audit.get(key, 0):
                      failures.append(key)
              queue = json.loads(Path("data/company_change_monitoring/review_queue.json").read_text(encoding="utf-8"))
              for source in queue.get("sourceStatuses", []):
                  if source.get("sourceId") in {"naver_api_hub", "dart"} and source.get("configured") is True and not source.get("attempted"):
                      failures.append(f"{source.get('sourceId')}_configured_not_attempted")
              operations = json.loads(Path("artifacts/company-change-monitor/operations-evaluation.json").read_text(encoding="utf-8"))
              if operations.get("state") == "FAILED":
                  failures.append("operations_state_failed")
              coverage = json.loads(Path("artifacts/company-source-coverage/source-coverage-report.json").read_text(encoding="utf-8"))
              if coverage.get("state") == "FAILED" or coverage.get("valid") is False:
                  failures.append("source_coverage_failed")

          if failures:
              print("final_acceptance: failed")
              for item in sorted(set(failures)):
                  print(f"- {item}")
              raise SystemExit(1)
          print("final_acceptance: passed")
          PY
