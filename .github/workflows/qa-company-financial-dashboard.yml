name: Company Financial Dashboard QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Financial dashboard regressions
        working-directory: frontend
        run: node scripts/test-company-financial-dashboard.mjs

      - name: Company detail regressions
        working-directory: frontend
        run: npm run test:companies-detail

      - name: Company v2 regressions
        working-directory: frontend
        run: npm run test:companies-v2

      - name: Company insight regressions
        working-directory: frontend
        run: npm run test:companies

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
