name: General Contractor Financial Production Coverage

on:
  pull_request:
    paths:
      - "frontend/public/data/companies/company_report_insights.json"
      - "frontend/src/components/company/CompanyFinancialTab.jsx"
      - "frontend/src/components/company/CompanyAuditFinancialPanel.jsx"
      - "scripts/build_company_report_insights.py"
      - "scripts/verify_general_contractor_financial_production.py"
      - "tests/test_general_contractor_financial_production_coverage.py"
      - ".github/workflows/general-contractor-financial-production-coverage.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/public/data/companies/company_report_insights.json"
      - "frontend/src/components/company/CompanyFinancialTab.jsx"
      - "frontend/src/components/company/CompanyAuditFinancialPanel.jsx"
      - "scripts/build_company_report_insights.py"
      - "scripts/verify_general_contractor_financial_production.py"
      - "tests/test_general_contractor_financial_production_coverage.py"
      - ".github/workflows/general-contractor-financial-production-coverage.yml"
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: general-contractor-financial-production-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contract:
    name: Local financial contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate local contractor View Model
        run: >-
          python scripts/verify_general_contractor_financial_production.py
          --file frontend/public/data/companies/company_report_insights.json
      - name: Run coverage regressions
        run: python -m pytest -q tests/test_general_contractor_financial_production_coverage.py

  production-contract:
    name: Production financial contract
    if: github.event_name != 'pull_request'
    needs: local-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify production matches current contractor View Model
        run: >-
          python scripts/verify_general_contractor_financial_production.py
          --url https://modularhub-public.vercel.app/data/companies/company_report_insights.json
          --expected-file frontend/public/data/companies/company_report_insights.json
          --retries 20
          --retry-delay 15
          --timeout 30
