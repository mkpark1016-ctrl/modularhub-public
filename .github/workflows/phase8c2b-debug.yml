name: Phase 8C-2B Debug Determinism

on:
  push:
    branches:
      - feat/audit-opinion-interpretation-notice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/audit-opinion-interpretation-notice
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema
      - name: Capture exact report insight pytest failure
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_company_report_insights.py --tb=short > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            failure=$(grep -E '^FAILED ' /tmp/pytest.log | head -n 1)
            detail=$(tail -n 40 /tmp/pytest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=${failure:-Python pytest failure}::${detail}"
          else
            echo "::notice title=Python pytest diagnostic::tests/test_company_report_insights.py passed"
          fi
          exit 0
