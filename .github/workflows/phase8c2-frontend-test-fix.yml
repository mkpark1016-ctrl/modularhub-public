name: Phase 8C-2 Frontend Test Fix

on:
  push:
    branches:
      - feat/geogwang-audit-financials

permissions:
  contents: write

jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geogwang-audit-financials
          fetch-depth: 0
      - name: Update frontend peer expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/scripts/test-company-detail-ui.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'assert.equal(yuchangRevenuePeer.comparison_universe_count, 5);': 'assert.equal(yuchangRevenuePeer.comparison_universe_count, 6);',
              'assert.equal(yuchangRevenuePeer.other_peer_count, 4);': 'assert.equal(yuchangRevenuePeer.other_peer_count, 5);',
              'assert.equal(yuchangRevenuePeer.median_display, "616.6억원");': 'assert.equal(yuchangRevenuePeer.median_display, "605.7억원");',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected frontend assertion not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updates and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase8c2-frontend-test-fix.yml
          git add frontend/scripts/test-company-detail-ui.mjs
          git commit -m "test: update frontend peer baseline for Geogwang"
          git push origin HEAD:feat/geogwang-audit-financials
