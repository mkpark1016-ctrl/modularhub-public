name: Phase 8C-2 Test Fix Round 3

on:
  push:
    branches:
      - feat/geogwang-audit-financials

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geogwang-audit-financials
          fetch-depth: 0
      - name: Update peer median expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_company_report_insights.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'assert benchmark["median_display"] == "616.6억원"': 'assert benchmark["median_display"] == "605.7억원"',
              'assert benchmark["median_difference_display"] == "중앙값보다 2,460.2억원 높음"': 'assert benchmark["median_difference_display"] == "중앙값보다 2,471.1억원 높음"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected assertion not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updates and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase8c2-test-fix-round3.yml
          git add tests/test_company_report_insights.py
          git commit -m "test: update peer median for Geogwang promotion"
          git push origin HEAD:feat/geogwang-audit-financials
