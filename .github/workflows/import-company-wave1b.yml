name: Import verified competitor baselines

on:
  push:
    branches:
      - data/company-baseline-wave1b
    paths:
      - .github/workflows/import-company-wave1b.yml
      - scripts/verified_companies/**
      - scripts/verified_import_helpers.py
      - scripts/verified_company_source.py
      - scripts/verified_company_apply.py
      - scripts/import_verified_company_baseline.py
      - scripts/test_verified_company_baseline.py
      - frontend/scripts/test-company-insights.mjs
      - frontend/scripts/test-company-intelligence-v2.mjs
      - frontend/scripts/test-company-projects.mjs
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-company-wave1b.yml
      - scripts/verified_companies/**
      - scripts/verified_import_helpers.py
      - scripts/verified_company_source.py
      - scripts/verified_company_apply.py
      - scripts/import_verified_company_baseline.py
      - scripts/test_verified_company_baseline.py
      - scripts/validate_company_universe.py
      - scripts/test_company_universe.py
      - frontend/scripts/test-company-insights.mjs
      - frontend/scripts/test-company-intelligence-v2.mjs
      - frontend/scripts/test-company-projects.mjs
      - frontend/public/data/companies/companies.json
      - frontend/public/data/companies/company_intelligence_v2.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-verified-companies-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout verified baseline branch
        uses: actions/checkout@v4
        with:
          ref: data/company-baseline-wave1b
          fetch-depth: 0

      - name: Record protected public JSON hashes
        shell: bash
        run: |
          sha256sum \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json \
            > /tmp/protected-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manually verified source modules
        shell: bash
        run: |
          python -m compileall \
            scripts/verified_companies \
            scripts/verified_import_helpers.py \
            scripts/verified_company_source.py \
            scripts/verified_company_apply.py \
            scripts/import_verified_company_baseline.py
          python scripts/import_verified_company_baseline.py --check

      - name: Generate verified V1 and V2 outputs
        run: python scripts/import_verified_company_baseline.py

      - name: Run Python regression and contract tests
        shell: bash
        run: |
          python scripts/test_verified_company_baseline.py
          python scripts/test_company_universe.py
          python scripts/validate_company_universe.py
          python scripts/test_public_json_export.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run company tests, lint and production build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          {
            npm run test:companies
            npm run test:companies-v2
            npm run test:companies-projects
            npm run test:companies-url
            npm run lint
            npm run build
          } 2>&1 | tee /tmp/verified-company-frontend.log

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verified-company-diagnostics
          path: /tmp/verified-company-frontend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify protected datasets and repository safety
        shell: bash
        run: |
          sha256sum -c /tmp/protected-before.sha256
          git diff --exit-code -- \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json
          git diff --check
          if git ls-files | grep -E '\.pdf$'; then
            echo 'Raw PDF files must not be committed by this workflow.' >&2
            exit 1
          fi

      - name: Commit validated generated outputs
        if: success() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          paths=(
            frontend/public/data/companies/companies.json
            frontend/public/data/companies/company_intelligence_v2.json
            scripts/validate_company_universe.py
            scripts/test_company_universe.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Generated outputs and company count contracts already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Import manually verified competitor company baselines'
          git pull --rebase origin data/company-baseline-wave1b
          git push origin HEAD:data/company-baseline-wave1b

      - name: Upload generated company outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-company-generated-json
          path: |
            frontend/public/data/companies/companies.json
            frontend/public/data/companies/company_intelligence_v2.json
          retention-days: 7
