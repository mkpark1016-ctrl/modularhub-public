name: Company Activity History Controls QA

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/companyActivities.js"
      - "frontend/src/components/company/CompanyActivityTimeline.jsx"
      - "frontend/scripts/test-company-activities.mjs"
      - ".github/workflows/qa-company-activity-history-controls.yml"

permissions:
  contents: read

jobs:
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run company activity regressions
        working-directory: frontend
        run: |
          npm run test:companies-activities
          npm run test:companies-detail
          npm run test:companies-url
          npm run test:companies
          npm run test:companies-v2

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
