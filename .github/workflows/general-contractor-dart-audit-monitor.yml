name: General Contractor OpenDART Audit Monitor

on:
  # Temporary branch trigger is removed after the live validation run passes.
  push:
    branches:
      - feat/general-contractor-dart-audit-monitor
  schedule:
    # Monday 07:17 KST (Sunday 22:17 UTC)
    - cron: "17 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Monitor regressions and compile
        run: |
          python -m pytest -q tests/test_general_contractor_dart_audit_monitor.py tests/test_general_contractor_dart_audit_adapter.py
          python -m compileall scripts src
          git diff --check

  live:
    needs: unit
    name: ${{ matrix.company }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        company:
          - gs-ec
          - samsung-ct-construction
          - hyundai-engineering
          - dl-enc
    env:
      OPENDART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install jsonschema
      - name: Build fresh read-only CFS candidate
        run: |
          python scripts/build_general_contractor_dart_audit_candidates.py \
            --companies "${{ matrix.company }}" \
            --output-dir artifacts/fresh \
            --require-all-valid
      - name: Compare with committed public audit source
        id: compare
        shell: bash
        run: |
          mkdir -p "artifacts/drift/${{ matrix.company }}"
          set +e
          python scripts/check_general_contractor_dart_audit_updates.py \
            --public "data/company_reports/${{ matrix.company }}/audit_financials_2023_2025.json" \
            --candidate "artifacts/fresh/${{ matrix.company }}/candidate_audit_financials.json" \
            --output-json "artifacts/drift/${{ matrix.company }}/update-check.json" \
            --output-md "artifacts/drift/${{ matrix.company }}/update-check.md" \
            --fail-on-change
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "review_required=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "review_required=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Upload sanitized review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractor-dart-monitor-${{ matrix.company }}
          path: |
            artifacts/drift/${{ matrix.company }}/update-check.json
            artifacts/drift/${{ matrix.company }}/update-check.md
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "## ${{ matrix.company }} OpenDART audit monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "artifacts/drift/${{ matrix.company }}/update-check.md" ]; then
            cat "artifacts/drift/${{ matrix.company }}/update-check.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Public data writes: **none**" >> "$GITHUB_STEP_SUMMARY"
      - name: Require review when source or values drift
        if: steps.compare.outputs.review_required == 'true'
        run: |
          echo "OpenDART source/value drift detected. Review the uploaded artifact before any public promotion."
          exit 1
