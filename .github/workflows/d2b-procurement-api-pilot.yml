name: D2B Procurement API Pilot

on:
  workflow_dispatch:
    inputs:
      resources:
        description: D2B resources to collect
        required: true
        default: procurement_plan,bid_notice
        type: string
      bid_lookback_days:
        description: Bounded bid notice lookback days
        required: true
        default: "90"
        type: string
      plan_lookahead_months:
        description: Bounded procurement plan lookahead months
        required: true
        default: "12"
        type: string
      max_pages:
        description: Maximum pages per endpoint group
        required: true
        default: "3"
        type: string
      acknowledge_live:
        description: Confirm one read-only D2B live staging run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  d2b-procurement-pilot:
    runs-on: ubuntu-latest
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard live opt-in and inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.acknowledge_live }}" != "true" ]; then
            echo "D2B live request skipped: acknowledge_live must be true."
            exit 1
          fi
          if [ "${{ inputs.resources }}" != "procurement_plan,bid_notice" ]; then
            echo "Unsupported resources for this pilot: ${{ inputs.resources }}"
            exit 1
          fi
          if [ "${{ inputs.max_pages }}" -gt 3 ]; then
            echo "max_pages must be <= 3 for the D2B staging pilot."
            exit 1
          fi

      - name: Check D2B secret configuration
        run: |
          if [ -n "${DATA_GO_KR_SERVICE_KEY}" ]; then
            echo "DATA_GO_KR_SERVICE_KEY configured: true"
          else
            echo "DATA_GO_KR_SERVICE_KEY configured: false"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip show pytest

      - name: Run D2B procurement pilot tests
        run: |
          python -m pytest -q tests/test_external_api_integration_foundation.py
          python -m pytest -q tests/test_d2b_procurement_api_pilot.py

      - name: Run D2B live staging pilot
        run: |
          python scripts/integrations/business/run_d2b_pilot.py \
            --resources "${{ inputs.resources }}" \
            --bid-lookback-days "${{ inputs.bid_lookback_days }}" \
            --plan-lookahead-months "${{ inputs.plan_lookahead_months }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --output-dir artifacts/d2b \
            --live \
            --acknowledge-live

      - name: Verify D2B staging outputs
        run: |
          test -f artifacts/d2b/d2b_summary.json
          test -f artifacts/d2b/d2b_records.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("artifacts/d2b/d2b_summary.json").read_text(encoding="utf-8"))
          records = json.loads(Path("artifacts/d2b/d2b_records.json").read_text(encoding="utf-8"))
          if summary.get("request_attempted") is not True:
              raise SystemExit("D2B request_attempted must be true")
          if not isinstance(records, list):
              raise SystemExit("D2B records must be a list")
          print(f"D2B records_normalized={summary.get('records_normalized')}")
          print(f"D2B overall_health={summary.get('overall_health')}")
          PY

      - name: Append sanitized D2B summary
        if: always()
        run: |
          if [ ! -f artifacts/d2b/d2b_summary.json ]; then
            echo "No D2B summary artifact was generated. An earlier workflow step failed before staging output." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' > d2b-summary.md
          import json
          from pathlib import Path
          summary = json.loads(Path("artifacts/d2b/d2b_summary.json").read_text(encoding="utf-8"))
          print("## D2B Procurement API Pilot")
          print("")
          print(f"- request_attempted: {summary.get('request_attempted')}")
          print(f"- overall_health: {summary.get('overall_health', '-')}")
          print(f"- records_normalized: {summary.get('records_normalized', 0)}")
          for name, resource in sorted((summary.get("resources") or {}).items()):
              first_error = (resource.get("api_errors") or [{}])[0]
              print(
                  "- "
                  + ", ".join(
                      [
                          f"{name}: pages_requested={resource.get('pages_requested')}",
                          f"received={resource.get('records_received')}",
                          f"matched={resource.get('records_matched')}",
                          f"normalized={resource.get('records_normalized')}",
                          f"invalid={resource.get('records_invalid')}",
                          f"duplicates={resource.get('duplicates')}",
                          f"api_errors={len(resource.get('api_errors') or [])}",
                          f"source_health={resource.get('source_health', '-')}",
                          f"error_category={first_error.get('category', '-')}",
                          f"result_code={first_error.get('result_code', '-')}",
                          f"transport_category={first_error.get('transport_category', '-')}",
                          f"attempt_count={first_error.get('attempt_count', '-')}",
                          f"final_exception_type={first_error.get('final_exception_type', '-')}",
                          f"endpoint_scheme={first_error.get('endpoint_scheme', '-')}",
                          f"endpoint_host={first_error.get('endpoint_host', '-')}",
                      ]
                  )
              )
          PY
          cat d2b-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload D2B staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2b-procurement-api-pilot-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/d2b/
          if-no-files-found: warn
