name: Clean Phase 8B-1 final diff

on:
  push:
    branches:
      - fix/company-type-first-discovery-and-financial-comparison

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore schema formatting from main and apply minimal semantic patch
        shell: bash
        run: |
          git show origin/main:schemas/company_reports/company_report_insights_v1.schema.json > schemas/company_reports/company_report_insights_v1.schema.json
          python - <<'PY'
          from pathlib import Path

          path = Path('schemas/company_reports/company_report_insights_v1.schema.json')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing schema target: {label}')
              text = text.replace(old, new, 1)

          once(
              '        "evidence_health",\n        "peer_benchmarks",',
              '        "evidence_health",\n        "comparison_context",\n        "peer_benchmarks",',
              'company required comparison context',
          )
          once(
              '        "evidence_health": {\n          "type": "array",\n          "items": { "$ref": "#/$defs/evidenceHealth" }\n        },\n        "peer_benchmarks": {',
              '        "evidence_health": {\n          "type": "array",\n          "items": { "$ref": "#/$defs/evidenceHealth" }\n        },\n        "comparison_context": { "$ref": "#/$defs/comparisonContext" },\n        "peer_benchmarks": {',
              'company property comparison context',
          )

          comparison_context = '''    "comparisonContext": {\n      "type": "object",\n      "required": ["company_type", "group_id", "group_label", "minimum_peer_count", "calculation_basis"],\n      "properties": {\n        "company_type": { "type": "string", "minLength": 1 },\n        "group_id": { "type": ["string", "null"] },\n        "group_label": { "type": ["string", "null"] },\n        "minimum_peer_count": { "type": "integer", "minimum": 3 },\n        "calculation_basis": { "const": "canonical_company_type_same_latest_year_currency_financial_scope" }\n      },\n      "additionalProperties": false\n    },\n'''
          once('    "peerBenchmark": {\n', comparison_context + '    "peerBenchmark": {\n', 'comparison context definition')

          once(
              '        "metric_id",\n        "company_value",',
              '        "metric_id",\n        "comparison_group_id",\n        "comparison_group_label",\n        "comparison_year",\n        "comparison_currency",\n        "comparison_financial_scope",\n        "company_value",',
              'peer required group context',
          )
          once(
              '        "median_display",\n        "best_value",',
              '        "median_display",\n        "median_difference_display",\n        "best_value",',
              'peer required median difference',
          )
          once(
              '        "metric_id": { "type": "string", "minLength": 1 },\n        "company_value":',
              '        "metric_id": { "type": "string", "minLength": 1 },\n        "comparison_group_id": { "type": ["string", "null"] },\n        "comparison_group_label": { "type": ["string", "null"] },\n        "comparison_year": { "type": "integer" },\n        "comparison_currency": { "const": "KRW" },\n        "comparison_financial_scope": { "enum": ["standalone", "consolidated", "standalone_and_consolidated"] },\n        "company_value":',
              'peer properties group context',
          )
          once(
              '        "median_display": { "type": "string", "minLength": 1 },\n        "best_value":',
              '        "median_display": { "type": "string", "minLength": 1 },\n        "median_difference_display": { "type": ["string", "null"] },\n        "best_value":',
              'peer property median difference',
          )
          once(
              '        "calculation_basis": { "const": "same_latest_year_currency_financial_scope_minimum_three_values" }',
              '        "calculation_basis": { "const": "same_company_group_latest_year_currency_financial_scope_minimum_three_values" }',
              'peer calculation basis',
          )

          path.write_text(text, encoding='utf-8')

          # Remove the extra blank line that git diff --check reported.
          test_path = Path('tests/test_company_report_insights.py')
          test_text = test_path.read_text(encoding='utf-8').rstrip() + '\n'
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Validate minimal schema patch
        run: |
          python -m pip install pytest jsonschema
          python scripts/build_company_report_insights.py --base-ref origin/main --check
          python -m pytest -q tests/test_company_report_insights.py

      - name: Remove temporary verification workflows
        run: |
          rm .github/workflows/phase8b1-verify.yml
          rm .github/workflows/phase8b1-cleanup.yml

      - name: Commit clean final Phase 8B-1 diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize type-first company discovery diff"
          git push origin HEAD:fix/company-type-first-discovery-and-financial-comparison

      - name: Final diff quality
        run: git diff --check origin/main...HEAD
