name: Phase 8C-2 Geogwang Regenerate

on:
  push:
    branches:
      - feat/geogwang-audit-financials

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip geogwang regen]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/geogwang-audit-financials
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip jsonschema pytest

      - name: Validate Geogwang audit source
        run: >-
          python scripts/validate_company_audit_financials.py
          --input data/company_reports/geogwang-enterprise/audit_financials_2023_2025.json
          --expected-years 2023 2024 2025
          --base-ref origin/main

      - name: Regenerate public report insights
        run: python scripts/build_company_report_insights.py --base-ref origin/main

      - name: Regenerate company data coverage
        run: python scripts/build_company_data_coverage.py --as-of-date 2026-08-10

      - name: Commit regenerated derived data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/companies/company_report_insights.json data/company_reports/company_data_coverage_snapshot.json
          if git diff --cached --quiet; then
            echo "No derived changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate Geogwang audit insights [skip geogwang regen]"
          git push origin HEAD:feat/geogwang-audit-financials
