name: Phase 8C-2 Geogwang QA

on:
  push:
    branches:
      - feat/geogwang-audit-financials

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/geogwang-audit-financials
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest jsonschema
      - name: Validate Geogwang source
        run: python scripts/validate_company_audit_financials.py --input data/company_reports/geogwang-enterprise/audit_financials_2023_2025.json --expected-years 2023 2024 2025 --base-ref origin/main
      - name: Verify derived outputs
        run: |
          python scripts/build_company_report_insights.py --base-ref origin/main --check
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-10 --check
      - name: Python tests and compile
        run: |
          python -m pytest -q
          python -m compileall scripts src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend company tests
        working-directory: frontend
        run: |
          npm run test:companies
          npm run test:companies-detail
          npm run test:companies-activities
          npm run test:companies-comparison
          npm run test:companies-url
          npm run test:companies-v2
          npm run test:companies-projects
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
