name: Update public data

on:
  schedule:
    # 22:00 UTC is 07:00 KST on the following day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: update-public-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-export-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create collector environment
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          if [ -n "${DATA_GO_KR_SERVICE_KEY}" ]; then echo "DATA_GO_KR_SERVICE_KEY configured: true"; else echo "DATA_GO_KR_SERVICE_KEY configured: false"; fi
          if [ -n "${LH_SERVICE_KEY}" ]; then echo "LH_SERVICE_KEY configured: true"; else echo "LH_SERVICE_KEY configured: false"; fi
          if [ -n "${NAVER_API_HUB_CLIENT_ID}" ]; then echo "NAVER_API_HUB_CLIENT_ID configured: true"; else echo "NAVER_API_HUB_CLIENT_ID configured: false"; fi
          if [ -n "${NAVER_API_HUB_CLIENT_SECRET}" ]; then echo "NAVER_API_HUB_CLIENT_SECRET configured: true"; else echo "NAVER_API_HUB_CLIENT_SECRET configured: false"; fi
          printf '%s\n' \
            "DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY}" \
            "LH_SERVICE_KEY=${LH_SERVICE_KEY}" \
            "NAVER_API_HUB_CLIENT_ID=${NAVER_API_HUB_CLIENT_ID}" \
            "NAVER_API_HUB_CLIENT_SECRET=${NAVER_API_HUB_CLIENT_SECRET}" \
            "NAVER_API_HUB_NEWS_ENDPOINT=https://naverapihub.apigw.ntruss.com/search/v1/news" \
            "G2B_MODULAR_LOOKBACK_DAYS=180" \
            "G2B_MODULAR_PAGE_SIZE=100" \
            "G2B_PLAN_LOOKAHEAD_MONTHS=12" \
            "G2B_PLAN_PAGE_SIZE=100" \
            "D2B_LOOKAHEAD_MONTHS=12" \
            "D2B_PAGE_SIZE=50" \
            "D2B_LEGACY_API_ENABLED=false" \
            "LH_CONTEST_ENABLED=true" \
            "LH_CONTEST_MAX_PAGES=10" \
            "LH_CONTEST_LOOKBACK_DAYS=730" \
            "LH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "LH_CONTEST_TIMEOUT_SECONDS=20" \
            "GH_CONTEST_ENABLED=true" \
            "GH_CONTEST_MAX_PAGES=10" \
            "GH_CONTEST_LOOKBACK_DAYS=730" \
            "GH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "GH_CONTEST_TIMEOUT_SECONDS=20" \
            "IH_CONTEST_ENABLED=true" \
            "IH_CONTEST_MAX_PAGES=10" \
            "IH_CONTEST_LOOKBACK_DAYS=730" \
            "IH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "IH_CONTEST_TIMEOUT_SECONDS=20" \
            "NAVER_NEWS_LOOKBACK_DAYS=14" \
            "NAVER_NEWS_DISPLAY=50" \
            "NAVER_NEWS_SORT=date" \
            "GDELT_DOC_NEWS_ENABLED=true" \
            "GDELT_DOC_NEWS_TIMESPAN=14d" \
            "GDELT_DOC_NEWS_MAX_RECORDS=250" \
            "GDELT_DOC_NEWS_TIMEOUT_SECONDS=30" \
            "GDELT_DOC_NEWS_MIN_RELEVANCE_SCORE=65" \
            "GDELT_DOC_NEWS_LANGUAGE=English" \
            "OVERSEAS_RSS_NEWS_ENABLED=true" \
            "OVERSEAS_RSS_NEWS_TIMEOUT_SECONDS=20" \
            "OVERSEAS_RSS_NEWS_LOOKBACK_DAYS=30" \
            "OVERSEAS_RSS_NEWS_MAX_ITEMS_PER_FEED=100" \
            "OVERSEAS_RSS_NEWS_MIN_RELEVANCE_SCORE=65" > .env

      - name: Back up currently published JSON
        run: |
          mkdir -p "$RUNNER_TEMP/public-data-backup"
          cp frontend/public/data/business.json "$RUNNER_TEMP/public-data-backup/business.json"
          cp frontend/public/data/news.json "$RUNNER_TEMP/public-data-backup/news.json"
          cp frontend/public/data/meta.json "$RUNNER_TEMP/public-data-backup/meta.json"

      - name: Collect bids and news
        run: |
          set +e
          command="python scripts/collect_all.py --skip-procurement-plans --skip-lh --skip-d2b"
          echo "Running: $command"
          $command
          code=$?
          echo "command=$command exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::입찰/뉴스 일부 수집기가 실패했습니다. exit_code=$code"
          fi
          exit 0

      - name: Upload news collection diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-collection-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/news_collection_diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect G2B procurement plans
        run: |
          if [ -f scripts/collect_g2b_procurement_plans.py ]; then
            set +e
            command="python scripts/collect_g2b_procurement_plans.py"
            echo "Running: $command"
            python scripts/collect_g2b_procurement_plans.py
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::나라장터 발주계획 수집 실패. exit_code=$code"
            fi
          else
            echo "G2B procurement plan collector is not present; continuing."
          fi
          exit 0

      - name: Record D2B legacy API status
        run: |
          echo "::warning::방위사업청 기존 군수품조달정보 API가 중지 상태입니다. 자동 수집에서 제외하며 추후 GW API 전환이 필요합니다."

      - name: Collect LH public housing contests
        run: |
          if [ -f scripts/collect_lh_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_lh_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::LH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "LH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect GH public housing contests
        run: |
          if [ -f scripts/collect_gh_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_gh_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::GH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "GH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect iH public housing contests
        run: |
          if [ -f scripts/collect_ih_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_ih_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::iH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "iH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect known important G2B bids
        run: |
          set +e
          command="python scripts/collect_known_g2b_bids.py"
          echo "Running: $command"
          $command
          code=$?
          echo "command=$command exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::known important bid 수집 실패. exit_code=$code"
          fi
          exit 0

      - name: Collect scheduled LH direct with conditional G2B fallback
        id: scheduled_lh
        continue-on-error: true
        run: |
          python -m scripts.integrations.business.run_lh_pilot \
            --resources procurement_plan,pre_spec,bid_notice \
            --lookback-days 30 \
            --page-size 5 \
            --max-pages 2 \
            --output-dir artifacts/scheduled-unified/lh \
            --live \
            --acknowledge-live

      - name: Collect scheduled D2B live feed
        id: scheduled_d2b
        continue-on-error: true
        run: |
          python scripts/integrations/business/run_d2b_pilot.py \
            --resources procurement_plan,bid_notice \
            --bid-lookback-days 90 \
            --plan-lookahead-months 12 \
            --max-pages 2 \
            --output-dir artifacts/scheduled-unified/d2b \
            --live \
            --acknowledge-live

      - name: Prepare scheduled Unified feed
        id: scheduled_unified
        shell: bash
        run: |
          set +e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "unified_ready=false" >> "$GITHUB_OUTPUT"
          echo "failure_category=source_transient" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.scheduled_lh.outcome }}" != "success" ]; then
            echo "::warning::SOURCE_TRANSIENT_FAILURE: scheduled LH collection failed; using the default exporter."
            exit 0
          fi
          if [ "${{ steps.scheduled_d2b.outcome }}" != "success" ]; then
            echo "::warning::SOURCE_TRANSIENT_FAILURE: scheduled D2B collection failed; using the default exporter."
            exit 0
          fi

          required_files=(
            artifacts/scheduled-unified/lh/lh_records.json
            artifacts/scheduled-unified/lh/lh_summary.json
            artifacts/scheduled-unified/d2b/d2b_records.json
            artifacts/scheduled-unified/d2b/d2b_summary.json
          )
          for path in "${required_files[@]}"; do
            if [ ! -f "$path" ]; then
              echo "failure_category=publication_safety" >> "$GITHUB_OUTPUT"
              echo "::error::PUBLICATION_SAFETY_FAILURE: required canonical artifact is missing: $path"
              exit 0
            fi
          done

          python -m scripts.integrations.business.validate_unified_live_staging \
            --lh-summary artifacts/scheduled-unified/lh/lh_summary.json \
            --lh-records artifacts/scheduled-unified/lh/lh_records.json \
            --d2b-summary artifacts/scheduled-unified/d2b/d2b_summary.json \
            --d2b-records artifacts/scheduled-unified/d2b/d2b_records.json \
            --source-only
          if [ "$?" -ne 0 ]; then
            echo "failure_category=publication_safety" >> "$GITHUB_OUTPUT"
            echo "::error::PUBLICATION_SAFETY_FAILURE: source artifacts failed canonical validation."
            exit 0
          fi

          python scripts/integrations/business/run_unified_business_feed.py \
            --lh-records artifacts/scheduled-unified/lh/lh_records.json \
            --d2b-records artifacts/scheduled-unified/d2b/d2b_records.json \
            --output-dir artifacts/scheduled-unified/unified
          if [ "$?" -ne 0 ]; then
            echo "failure_category=publication_safety" >> "$GITHUB_OUTPUT"
            echo "::error::PUBLICATION_SAFETY_FAILURE: Unified artifact build failed."
            exit 0
          fi

          python -m scripts.integrations.business.validate_unified_live_staging \
            --lh-summary artifacts/scheduled-unified/lh/lh_summary.json \
            --lh-records artifacts/scheduled-unified/lh/lh_records.json \
            --d2b-summary artifacts/scheduled-unified/d2b/d2b_summary.json \
            --d2b-records artifacts/scheduled-unified/d2b/d2b_records.json \
            --unified-summary artifacts/scheduled-unified/unified/unified_business_summary.json \
            --unified-records artifacts/scheduled-unified/unified/unified_business_records.json
          if [ "$?" -ne 0 ]; then
            echo "failure_category=publication_safety" >> "$GITHUB_OUTPUT"
            echo "::error::PUBLICATION_SAFETY_FAILURE: Unified acceptance validation failed."
            exit 0
          fi

          echo "unified_ready=true" >> "$GITHUB_OUTPUT"
          echo "failure_category=none" >> "$GITHUB_OUTPUT"

      - name: Export public JSON
        run: |
          if [ "${{ steps.scheduled_unified.outputs.unified_ready }}" = "true" ]; then
            python scripts/export_public_json.py \
              --unified-business-records artifacts/scheduled-unified/unified/unified_business_records.json \
              --unified-business-summary artifacts/scheduled-unified/unified/unified_business_summary.json \
              --unified-integration-report artifacts/scheduled-unified/public_pipeline_integration_report.json
          else
            python scripts/export_public_json.py
          fi

      - name: Append scheduled Unified summary
        if: always()
        env:
          UNIFIED_ATTEMPTED: ${{ steps.scheduled_unified.outputs.attempted }}
          UNIFIED_READY: ${{ steps.scheduled_unified.outputs.unified_ready }}
          FAILURE_CATEGORY: ${{ steps.scheduled_unified.outputs.failure_category }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          def load(path):
              file_path = Path(path)
              if not file_path.is_file():
                  return {}
              try:
                  payload = json.loads(file_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              return payload if isinstance(payload, dict) else {}

          lh = load("artifacts/scheduled-unified/lh/lh_summary.json")
          d2b = load("artifacts/scheduled-unified/d2b/d2b_summary.json")
          unified = load("artifacts/scheduled-unified/unified/unified_business_summary.json")
          integration = load("artifacts/scheduled-unified/public_pipeline_integration_report.json")
          security = unified.get("security") or {}
          ready = os.environ.get("UNIFIED_READY", "false") == "true"

          print("## Scheduled Unified Business Collection")
          print(f"- Unified attempted: {os.environ.get('UNIFIED_ATTEMPTED', 'false')}")
          print(f"- Unified ready: {str(ready).lower()}")
          print(f"- LH health: {lh.get('overall_health', 'not_generated')}")
          print(f"- LH fallback: {lh.get('fallback_used', False)}")
          print(f"- D2B health: {d2b.get('overall_health', 'not_generated')}")
          print(f"- Unified input/output: {unified.get('records_input', 0)}/{unified.get('records_output', 0)}")
          print(f"- Publishable: {integration.get('publishable_count', 0)}")
          print(f"- Net new: {integration.get('net_new_count', 0)}")
          print(f"- Candidate total: {integration.get('candidate_public_count', 0)}")
          print(f"- Security: {security.get('passed', False)}")
          print(f"- Failure category: {os.environ.get('FAILURE_CATEGORY', 'unknown')}")
          print(f"- Fallback default exporter used: {str(not ready).lower()}")
          PY

      - name: Upload scheduled Unified diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-unified-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/scheduled-unified/lh/lh_summary.json
            artifacts/scheduled-unified/lh/lh_records.json
            artifacts/scheduled-unified/d2b/d2b_summary.json
            artifacts/scheduled-unified/d2b/d2b_records.json
            artifacts/scheduled-unified/unified/unified_business_summary.json
            artifacts/scheduled-unified/unified/unified_business_records.json
            artifacts/scheduled-unified/public_pipeline_integration_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build company activity timelines
        run: |
          set +e
          python scripts/build_company_activity_timeline.py
          code=$?
          if [ -f artifacts/company_activity_timeline/company-activity-audit.md ]; then
            cat artifacts/company_activity_timeline/company-activity-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Company activity timeline generation failed. Existing company-activities.json is preserved if present. exit_code=$code"
          fi
          exit 0

      - name: Upload company activity timeline audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-activity-timeline-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/company_activity_timeline/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit overseas RSS publication
        run: |
          set +e
          python scripts/audit_overseas_rss_publication.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/overseas_rss_audit
          code=$?
          if [ -f artifacts/overseas_rss_audit/overseas_rss_audit.md ]; then
            cat artifacts/overseas_rss_audit/overseas_rss_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          status=$(python -c "import json; print(json.load(open('artifacts/overseas_rss_audit/overseas_rss_audit.json', encoding='utf-8'))['audit_status'])")
          if [ "$status" = "passed_with_warnings" ]; then
            echo "::warning::Overseas RSS publication audit passed with warnings."
          fi

      - name: Upload overseas RSS audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overseas-rss-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/overseas_rss_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit unified public news
        if: always()
        run: |
          set +e
          python scripts/audit_unified_news_live.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/unified_news_live_audit
          code=$?
          if [ -f artifacts/unified_news_live_audit/unified_news_live_audit.md ]; then
            cat artifacts/unified_news_live_audit/unified_news_live_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Summarize public news freshness
        if: always()
        run: |
          set +e
          python scripts/audit_public_news_freshness.py \
            --news frontend/public/data/news.json \
            --meta frontend/public/data/meta.json \
            --output-dir artifacts/public_news_freshness
          code=$?
          if [ -f artifacts/public_news_freshness/public_news_freshness.md ]; then
            cat artifacts/public_news_freshness/public_news_freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Upload public news freshness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-news-freshness-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/public_news_freshness/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unified public news audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-news-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/unified_news_live_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit news publisher country metadata
        if: always()
        run: |
          set +e
          python scripts/audit_news_publisher_country.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/news_publisher_country_audit \
            --strict-stored-fields
          code=$?
          if [ -f artifacts/news_publisher_country_audit/news_publisher_country_audit.md ]; then
            cat artifacts/news_publisher_country_audit/news_publisher_country_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          status=$(python -c "import json; print(json.load(open('artifacts/news_publisher_country_audit/news_publisher_country_audit.json', encoding='utf-8'))['audit_status'])")
          if [ "$status" = "passed_with_country_mapping_required" ]; then
            echo "::warning::Publisher country audit passed with country mapping follow-up required."
          elif [ "$status" = "passed_with_warnings" ]; then
            echo "::warning::Publisher country audit passed with warnings."
          fi

      - name: Upload publisher country audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-publisher-country-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/news_publisher_country_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit business collection impact
        if: always()
        run: |
          set +e
          python scripts/audit_business_collection_impact.py \
            --business frontend/public/data/business.json \
            --output-dir artifacts/business-collection-impact-audit
          code=$?
          if [ -f artifacts/business-collection-impact-audit/business_collection_impact_audit.md ]; then
            cat artifacts/business-collection-impact-audit/business_collection_impact_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Business collection impact audit failed. Public data export remains governed by the existing guard. exit_code=$code"
          fi
          exit 0

      - name: Upload business collection impact audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-collection-impact-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/business-collection-impact-audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit operations freshness and safeguards
        if: always()
        run: |
          set +e
          python scripts/audit_public_data_freshness.py \
            --output-dir artifacts/operations \
            --strict-critical
          code=$?
          if [ -f artifacts/operations/freshness-report.md ]; then
            cat artifacts/operations/freshness-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Publish operations alert issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/operations_issue_alert.py \
            --summary artifacts/operations/freshness-summary.json \
            --repo "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload operations audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-freshness-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/operations/
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnose procurement plan pipeline
        run: |
          if [ -f scripts/diagnose_procurement_plan_gap.py ]; then
            set +e
            command="python scripts/diagnose_procurement_plan_gap.py"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::발주계획 진단 스크립트 실패. exit_code=$code"
            fi
          else
            echo "::warning::scripts/diagnose_procurement_plan_gap.py가 없어 진단을 건너뜁니다."
          fi
          exit 0

      - name: Diagnose public JSON counts
        run: python scripts/diagnose_public_json_counts.py

      - name: Audit public JSON delta
        id: public_json_delta_audit
        run: |
          set +e
          python scripts/audit_public_json_delta.py --base git-head --current frontend/public/data/business.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload public JSON delta audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-json-delta-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            logs/public_json_delta_audit.json
            logs/public_json_delta_audit.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce public JSON delta audit
        if: always()
        run: |
          code="${{ steps.public_json_delta_audit.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "::error::Public JSON delta audit did not report an exit code."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Public JSON delta audit blocked publication. exit_code=$code"
            exit "$code"
          fi

      - name: Enforce scheduled Unified publication safety
        if: steps.scheduled_unified.outputs.failure_category == 'publication_safety'
        run: |
          echo "PUBLICATION_SAFETY_FAILURE: scheduled Unified artifacts were malformed or failed integrity validation."
          exit 1

      - name: Protect cumulative public JSON
        id: publish_guard
        run: |
          set +e
          python scripts/refuse_suspicious_public_data_shrink.py
          code=$?
          if [ "$code" -ne 0 ]; then
            cp "$RUNNER_TEMP/public-data-backup/business.json" frontend/public/data/business.json
            cp "$RUNNER_TEMP/public-data-backup/news.json" frontend/public/data/news.json
            cp "$RUNNER_TEMP/public-data-backup/meta.json" frontend/public/data/meta.json
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::비정상적인 공개 데이터 감소를 감지해 기존 JSON을 복원하고 commit을 차단했습니다. exit_code=$code"
            exit "$code"
          fi
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"

      - name: Run public data security and contract tests
        if: steps.publish_guard.outputs.publish_ready == 'true'
        run: |
          set -e
          echo "Running: python scripts/test_public_json_export.py"
          python scripts/test_public_json_export.py
          echo "command=test_public_json_export.py exit_code=0"
          echo "Running: python scripts/test_procurement_plan_pipeline.py"
          python scripts/test_procurement_plan_pipeline.py
          echo "command=test_procurement_plan_pipeline.py exit_code=0"

      - name: Set up Node
        if: steps.publish_guard.outputs.publish_ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.publish_guard.outputs.publish_ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit updated public JSON
        if: steps.publish_guard.outputs.publish_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/business.json frontend/public/data/news.json frontend/public/data/meta.json
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
            exit 0
          fi
          git commit -m "chore: update public ModularHub data"
          git push
