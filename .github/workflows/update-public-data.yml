name: Update public data

on:
  schedule:
    # 22:00 UTC is 07:00 KST on the following day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-data
  cancel-in-progress: false

jobs:
  collect-export-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create collector environment
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: |
          printf '%s\n' \
            "DATA_GO_KR_SERVICE_KEY=${DATA_GO_KR_SERVICE_KEY}" \
            "NAVER_API_HUB_CLIENT_ID=${NAVER_API_HUB_CLIENT_ID}" \
            "NAVER_API_HUB_CLIENT_SECRET=${NAVER_API_HUB_CLIENT_SECRET}" \
            "NAVER_API_HUB_NEWS_ENDPOINT=https://naverapihub.apigw.ntruss.com/search/v1/news" \
            "G2B_MODULAR_LOOKBACK_DAYS=180" \
            "G2B_MODULAR_PAGE_SIZE=100" \
            "G2B_PLAN_LOOKAHEAD_MONTHS=12" \
            "G2B_PLAN_PAGE_SIZE=100" \
            "D2B_LOOKAHEAD_MONTHS=12" \
            "D2B_PAGE_SIZE=50" \
            "D2B_LEGACY_API_ENABLED=false" \
            "LH_CONTEST_ENABLED=true" \
            "LH_CONTEST_MAX_PAGES=10" \
            "LH_CONTEST_LOOKBACK_DAYS=730" \
            "LH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "LH_CONTEST_TIMEOUT_SECONDS=20" \
            "GH_CONTEST_ENABLED=true" \
            "GH_CONTEST_MAX_PAGES=10" \
            "GH_CONTEST_LOOKBACK_DAYS=730" \
            "GH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "GH_CONTEST_TIMEOUT_SECONDS=20" \
            "IH_CONTEST_ENABLED=true" \
            "IH_CONTEST_MAX_PAGES=10" \
            "IH_CONTEST_LOOKBACK_DAYS=730" \
            "IH_CONTEST_REQUEST_INTERVAL_SECONDS=1.5" \
            "IH_CONTEST_TIMEOUT_SECONDS=20" \
            "NAVER_NEWS_LOOKBACK_DAYS=14" \
            "NAVER_NEWS_DISPLAY=50" \
            "NAVER_NEWS_SORT=date" \
            "GDELT_DOC_NEWS_ENABLED=false" \
            "GDELT_DOC_NEWS_TIMESPAN=7d" \
            "GDELT_DOC_NEWS_MAX_RECORDS=250" \
            "GDELT_DOC_NEWS_TIMEOUT_SECONDS=30" \
            "GDELT_DOC_NEWS_MIN_RELEVANCE_SCORE=70" \
            "GDELT_DOC_NEWS_LANGUAGE=English" \
            "OVERSEAS_RSS_NEWS_ENABLED=true" \
            "OVERSEAS_RSS_NEWS_TIMEOUT_SECONDS=20" \
            "OVERSEAS_RSS_NEWS_LOOKBACK_DAYS=14" \
            "OVERSEAS_RSS_NEWS_MAX_ITEMS_PER_FEED=100" \
            "OVERSEAS_RSS_NEWS_MIN_RELEVANCE_SCORE=70" > .env

      - name: Back up currently published JSON
        run: |
          mkdir -p "$RUNNER_TEMP/public-data-backup"
          cp frontend/public/data/business.json "$RUNNER_TEMP/public-data-backup/business.json"
          cp frontend/public/data/news.json "$RUNNER_TEMP/public-data-backup/news.json"
          cp frontend/public/data/meta.json "$RUNNER_TEMP/public-data-backup/meta.json"

      - name: Collect bids and news
        run: |
          set +e
          command="python scripts/collect_all.py --skip-procurement-plans --skip-lh --skip-d2b"
          echo "Running: $command"
          $command
          code=$?
          echo "command=$command exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::입찰/뉴스 일부 수집기가 실패했습니다. exit_code=$code"
          fi
          exit 0

      - name: Collect G2B procurement plans
        run: |
          if [ -f scripts/collect_g2b_procurement_plans.py ]; then
            set +e
            command="python scripts/collect_g2b_procurement_plans.py"
            echo "Running: $command"
            python scripts/collect_g2b_procurement_plans.py
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::나라장터 발주계획 수집 실패. exit_code=$code"
            fi
          else
            echo "G2B procurement plan collector is not present; continuing."
          fi
          exit 0

      - name: Record D2B legacy API status
        run: |
          echo "::warning::방위사업청 기존 군수품조달정보 API가 중지 상태입니다. 자동 수집에서 제외하며 추후 GW API 전환이 필요합니다."

      - name: Collect LH public housing contests
        run: |
          if [ -f scripts/collect_lh_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_lh_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::LH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "LH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect GH public housing contests
        run: |
          if [ -f scripts/collect_gh_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_gh_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::GH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "GH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect iH public housing contests
        run: |
          if [ -f scripts/collect_ih_public_housing_contests.py ]; then
            set +e
            command="python scripts/collect_ih_public_housing_contests.py --apply"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::iH 민간참여 공공주택 공모 수집 실패. 기존 공개 JSON은 유지됩니다. exit_code=$code"
            fi
          else
            echo "iH public housing contest collector is not present; continuing."
          fi
          exit 0

      - name: Collect known important G2B bids
        run: |
          set +e
          command="python scripts/collect_known_g2b_bids.py"
          echo "Running: $command"
          $command
          code=$?
          echo "command=$command exit_code=$code"
          if [ "$code" -ne 0 ]; then
            echo "::warning::known important bid 수집 실패. exit_code=$code"
          fi
          exit 0

      - name: Export public JSON
        run: python scripts/export_public_json.py

      - name: Audit overseas RSS publication
        run: |
          set +e
          python scripts/audit_overseas_rss_publication.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/overseas_rss_audit
          code=$?
          if [ -f artifacts/overseas_rss_audit/overseas_rss_audit.md ]; then
            cat artifacts/overseas_rss_audit/overseas_rss_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          status=$(python -c "import json; print(json.load(open('artifacts/overseas_rss_audit/overseas_rss_audit.json', encoding='utf-8'))['audit_status'])")
          if [ "$status" = "passed_with_warnings" ]; then
            echo "::warning::Overseas RSS publication audit passed with warnings."
          fi

      - name: Upload overseas RSS audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overseas-rss-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/overseas_rss_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit unified public news
        if: always()
        run: |
          set +e
          python scripts/audit_unified_news_live.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/unified_news_live_audit
          code=$?
          if [ -f artifacts/unified_news_live_audit/unified_news_live_audit.md ]; then
            cat artifacts/unified_news_live_audit/unified_news_live_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Summarize public news freshness
        if: always()
        run: |
          set +e
          python scripts/audit_public_news_freshness.py \
            --news frontend/public/data/news.json \
            --meta frontend/public/data/meta.json \
            --output-dir artifacts/public_news_freshness
          code=$?
          if [ -f artifacts/public_news_freshness/public_news_freshness.md ]; then
            cat artifacts/public_news_freshness/public_news_freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Upload public news freshness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-news-freshness-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/public_news_freshness/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unified public news audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-news-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/unified_news_live_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit news publisher country metadata
        if: always()
        run: |
          set +e
          python scripts/audit_news_publisher_country.py \
            --input frontend/public/data/news.json \
            --output-dir artifacts/news_publisher_country_audit \
            --strict-stored-fields
          code=$?
          if [ -f artifacts/news_publisher_country_audit/news_publisher_country_audit.md ]; then
            cat artifacts/news_publisher_country_audit/news_publisher_country_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          status=$(python -c "import json; print(json.load(open('artifacts/news_publisher_country_audit/news_publisher_country_audit.json', encoding='utf-8'))['audit_status'])")
          if [ "$status" = "passed_with_country_mapping_required" ]; then
            echo "::warning::Publisher country audit passed with country mapping follow-up required."
          elif [ "$status" = "passed_with_warnings" ]; then
            echo "::warning::Publisher country audit passed with warnings."
          fi

      - name: Upload publisher country audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-publisher-country-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/news_publisher_country_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit business collection impact
        if: always()
        run: |
          set +e
          python scripts/audit_business_collection_impact.py \
            --business frontend/public/data/business.json \
            --output-dir artifacts/business-collection-impact-audit
          code=$?
          if [ -f artifacts/business-collection-impact-audit/business_collection_impact_audit.md ]; then
            cat artifacts/business-collection-impact-audit/business_collection_impact_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Business collection impact audit failed. Public data export remains governed by the existing guard. exit_code=$code"
          fi
          exit 0

      - name: Upload business collection impact audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-collection-impact-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/business-collection-impact-audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnose procurement plan pipeline
        run: |
          if [ -f scripts/diagnose_procurement_plan_gap.py ]; then
            set +e
            command="python scripts/diagnose_procurement_plan_gap.py"
            echo "Running: $command"
            $command
            code=$?
            echo "command=$command exit_code=$code"
            if [ "$code" -ne 0 ]; then
              echo "::warning::발주계획 진단 스크립트 실패. exit_code=$code"
            fi
          else
            echo "::warning::scripts/diagnose_procurement_plan_gap.py가 없어 진단을 건너뜁니다."
          fi
          exit 0

      - name: Diagnose public JSON counts
        run: python scripts/diagnose_public_json_counts.py

      - name: Audit public JSON delta
        run: python scripts/audit_public_json_delta.py --base git-head --current frontend/public/data/business.json

      - name: Protect cumulative public JSON
        id: publish_guard
        run: |
          set +e
          python scripts/refuse_suspicious_public_data_shrink.py
          code=$?
          if [ "$code" -ne 0 ]; then
            cp "$RUNNER_TEMP/public-data-backup/business.json" frontend/public/data/business.json
            cp "$RUNNER_TEMP/public-data-backup/news.json" frontend/public/data/news.json
            cp "$RUNNER_TEMP/public-data-backup/meta.json" frontend/public/data/meta.json
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::비정상적인 공개 데이터 감소를 감지해 기존 JSON을 복원하고 commit을 차단했습니다. exit_code=$code"
            exit "$code"
          fi
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"

      - name: Run public data security and contract tests
        if: steps.publish_guard.outputs.publish_ready == 'true'
        run: |
          set -e
          echo "Running: python scripts/test_public_json_export.py"
          python scripts/test_public_json_export.py
          echo "command=test_public_json_export.py exit_code=0"
          echo "Running: python scripts/test_procurement_plan_pipeline.py"
          python scripts/test_procurement_plan_pipeline.py
          echo "command=test_procurement_plan_pipeline.py exit_code=0"

      - name: Set up Node
        if: steps.publish_guard.outputs.publish_ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.publish_guard.outputs.publish_ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit updated public JSON
        if: steps.publish_guard.outputs.publish_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/business.json frontend/public/data/news.json frontend/public/data/meta.json
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
            exit 0
          fi
          git commit -m "chore: update public ModularHub data"
          git push
