name: General Contractor DART Audit Matrix QA

on:
  push:
    branches:
      - feat/general-contractor-dart-audit-adapter

permissions:
  contents: read

jobs:
  company:
    name: ${{ matrix.company }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        company:
          - gs-ec
          - samsung-ct-construction
          - hyundai-engineering
          - dl-enc
    env:
      OPENDART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install jsonschema pytest
      - name: Unit regressions
        run: python -m pytest -q tests/test_general_contractor_dart_audit_adapter.py
      - name: Live CFS candidate
        run: python scripts/build_general_contractor_dart_audit_candidates.py --companies "${{ matrix.company }}" --require-all-valid
      - name: Existing audit regressions
        run: python -m pytest -q tests/test_company_audit_financials.py tests/test_company_report_insights.py
      - name: Protected public data and diff hygiene
        run: |
          git diff --exit-code origin/main...HEAD -- \
            frontend/public/data/companies/companies.json \
            frontend/public/data/companies/company_intelligence_v2.json \
            frontend/public/data/companies/company_report_insights.json \
            frontend/public/data/news.json \
            frontend/public/data/business.json \
            frontend/public/data/meta.json
          git diff --check origin/main...HEAD
      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-audit-${{ matrix.company }}
          path: artifacts/general-contractor-dart-audit/**
          if-no-files-found: warn
          retention-days: 7
