name: General Contractor Working Capital Reconciliation QA

on:
  push:
    branches:
      - feat/general-contractor-working-capital-reconciliation

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m pytest -q \
            tests/test_general_contractor_working_capital.py \
            tests/test_general_contractor_receivable_reconciliation.py \
            tests/test_general_contractor_dart_audit_adapter.py
          python -m compileall scripts src
          git diff --check

  reconcile:
    needs: unit
    name: ${{ matrix.company }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        company:
          - gs-ec
          - samsung-ct-construction
          - hyundai-engineering
          - dl-enc
    env:
      OPENDART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Reconcile exact receivables
        run: |
          python scripts/reconcile_general_contractor_working_capital.py \
            --companies "${{ matrix.company }}" \
            --output-dir artifacts/reconciliation
      - uses: actions/upload-artifact@v4
        with:
          name: working-capital-reconciliation-${{ matrix.company }}
          path: artifacts/reconciliation/${{ matrix.company }}/*.json
          retention-days: 7
