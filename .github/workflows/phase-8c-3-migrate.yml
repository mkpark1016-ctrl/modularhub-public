name: Phase 8C-3 strategy migration

on:
  push:
    branches: [feat/company-strategy-override-layer]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/company-strategy-override-layer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded strategy migration
        run: python scripts/migrations/apply_phase_8c_3.py

      - name: Validate strategy data contract
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q tests/test_company_strategy_contract.py
          python -m json.tool frontend/public/data/companies/company_strategy.json >/dev/null
          python -m json.tool schemas/companies/company_strategy_v1.schema.json >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run strategy regression tests
        working-directory: frontend
        run: |
          node scripts/test-company-strategy-monitoring.mjs
          npm run test:companies
          npm run test:companies-comparison
          npm run test:companies-detail
          npm run test:companies-url
          npm run test:companies-activities

      - name: Lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Commit migrated application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/companyInsights.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migrated source changes to commit."
            exit 0
          fi
          git commit -m "Use data-driven company strategy overrides"
          git push origin HEAD:feat/company-strategy-override-layer
