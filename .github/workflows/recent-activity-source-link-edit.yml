name: Recent Activity Source Link QA

on:
  push:
    branches:
      - feat/recent-activity-source-links

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recent-activity-source-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest jsonschema
      - name: Python regressions and compile
        run: |
          python -m pytest -q
          python -m compileall scripts src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Recent activity and company UI regressions
        working-directory: frontend
        run: |
          npm run test:companies-activities
          npm run test:companies-detail
          npm run test:companies-url
          npm run test:companies-v2
      - name: Lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
