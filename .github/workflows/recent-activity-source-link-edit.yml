name: Recent Activity Source Link Edit

on:
  push:
    branches:
      - feat/recent-activity-source-links

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recent-activity-source-links
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source-link patch
        run: |
          python scripts/apply_recent_activity_source_links_once.py
          git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet -- frontend/src/components/company/CompanyOverviewTab.jsx frontend/scripts/test-company-activities.mjs; then
            echo "No source-link edits needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/company/CompanyOverviewTab.jsx frontend/scripts/test-company-activities.mjs
          git commit -m "Link recent activities to original sources"
          git push origin HEAD:feat/recent-activity-source-links
