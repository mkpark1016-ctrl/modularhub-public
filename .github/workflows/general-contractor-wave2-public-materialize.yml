name: General Contractor Wave2 Public Materialize

on:
  push:
    branches:
      - feat/general-contractor-dart-audit-financials-wave2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install jsonschema pytest
          cd frontend
          npm ci

      - name: Promote three staged contractor sources
        run: |
          for company in samsung-ct-construction hyundai-engineering dl-enc; do
            cp "data/company_reports/${company}/staging/audit_financials_2023_2025.json" \
              "data/company_reports/${company}/audit_financials_2023_2025.json"
            python scripts/validate_company_audit_financials.py \
              --input "data/company_reports/${company}/audit_financials_2023_2025.json" \
              --expected-years 2023 2024 2025 \
              --base-ref origin/main
          done

      - name: Rebuild full audit-backed View Model and coverage
        run: |
          python scripts/build_company_report_insights.py
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-11

      - name: Update full-universe regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found: {path_text}: {old[:100]}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          coverage = Path('tests/test_company_data_coverage.py')
          text = coverage.read_text(encoding='utf-8')
          replacements = {
              'assert payload["summary"]["audit_backed_company_count"] == 8': 'assert payload["summary"]["audit_backed_company_count"] == 11',
              'assert payload["summary"]["full_three_year_audit_count"] == 8': 'assert payload["summary"]["full_three_year_audit_count"] == 11',
              'assert payload["summary"]["audit_record_count"] == 8': 'assert payload["summary"]["audit_record_count"] == 11',
              'assert payload["summary"]["audit_backed_in_canonical_universe_count"] == 8': 'assert payload["summary"]["audit_backed_in_canonical_universe_count"] == 11',
              'assert payload["summary"]["audit_backed_in_universe_count"] == 8': 'assert payload["summary"]["audit_backed_in_universe_count"] == 11',
              'assert payload["summary"]["audit_backed_in_effective_universe_count"] == 8': 'assert payload["summary"]["audit_backed_in_effective_universe_count"] == 11',
              'assert payload["summary"]["full_three_year_audit_record_count"] == 8': 'assert payload["summary"]["full_three_year_audit_record_count"] == 11',
              'assert payload["summary"]["full_three_year_audit_in_canonical_universe_count"] == 8': 'assert payload["summary"]["full_three_year_audit_in_canonical_universe_count"] == 11',
              'assert payload["summary"]["full_three_year_audit_in_universe_count"] == 8': 'assert payload["summary"]["full_three_year_audit_in_universe_count"] == 11',
              'assert payload["summary"]["full_three_year_audit_in_effective_universe_count"] == 8': 'assert payload["summary"]["full_three_year_audit_in_effective_universe_count"] == 11',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'coverage anchor missing: {old}')
              text = text.replace(old, new)
          state_anchor = '''    assert companies["gs-ec"]["audit_coverage_state"] == "verification_pending"'''
          state_replacement = '''    assert companies["gs-ec"]["audit_coverage_state"] == "verification_pending"\n    assert companies["samsung-ct-construction"]["audit_coverage_state"] == "verification_pending"\n    assert companies["hyundai-engineering"]["audit_coverage_state"] == "verification_pending"\n    assert companies["dl-enc"]["audit_coverage_state"] == "verification_pending"'''
          if state_anchor not in text:
              raise SystemExit('coverage state anchor missing')
          text = text.replace(state_anchor, state_replacement, 1)
          coverage.write_text(text, encoding='utf-8')

          replace_once(
              'tests/test_company_report_insights.py',
              '["daeseung-engineering", "geogwang-enterprise", "gs-ec", "kumkang-kind", "nrb", "planm", "sungji-steel", "yuchang-enc"]',
              '["daeseung-engineering", "dl-enc", "geogwang-enterprise", "gs-ec", "hyundai-engineering", "kumkang-kind", "nrb", "planm", "samsung-ct-construction", "sungji-steel", "yuchang-enc"]',
          )
          geogwang = Path('tests/test_geogwang_audit_financials.py')
          gtext = geogwang.read_text(encoding='utf-8')
          for key in ['audit_record_count', 'audit_backed_in_effective_universe_count', 'full_three_year_audit_record_count']:
              old = f'assert payload["{key}"] == 8'
              new = f'assert payload["{key}"] == 11'
              if old not in gtext:
                  raise SystemExit(f'Geogwang anchor missing: {old}')
              gtext = gtext.replace(old, new, 1)
          geogwang.write_text(gtext, encoding='utf-8')

          nrb = Path('tests/test_nrb_financial_source_reconciliation.py')
          ntext = nrb.read_text(encoding='utf-8')
          old = '''        "daeseung-engineering",\n        "geogwang-enterprise",\n        "gs-ec",\n        "kumkang-kind",'''
          new = '''        "daeseung-engineering",\n        "dl-enc",\n        "geogwang-enterprise",\n        "gs-ec",\n        "hyundai-engineering",\n        "kumkang-kind",'''
          if old not in ntext:
              raise SystemExit('NRB universe anchor missing')
          ntext = ntext.replace(old, new, 1)
          old2 = '''        "planm",\n        "sungji-steel",'''
          new2 = '''        "planm",\n        "samsung-ct-construction",\n        "sungji-steel",'''
          if old2 not in ntext:
              raise SystemExit('NRB Samsung anchor missing')
          ntext = ntext.replace(old2, new2, 1)
          nrb.write_text(ntext, encoding='utf-8')
          PY

      - name: Update general-contractor frontend and peer regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/scripts/test-company-detail-ui.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = 'assert.equal(gsReport.source_summary.audit_opinions.at(-1).auditor, "한영회계법인");'
          addition = r'''
          const samsungReport = getCompanyReportInsight(reportPayload, "samsung-ct-construction");
          const hyundaiReport = getCompanyReportInsight(reportPayload, "hyundai-engineering");
          const dlReport = getCompanyReportInsight(reportPayload, "dl-enc");
          for (const [companyId, report] of [
            ["samsung-ct-construction", samsungReport],
            ["hyundai-engineering", hyundaiReport],
            ["dl-enc", dlReport],
          ]) {
            assert.ok(report, `${companyId} should use the common audit financial panel`);
            assert.deepEqual(reportYears(report), [2023, 2024, 2025]);
            assert.equal(report.financial_scope, "consolidated");
            assert.equal(report.latest_year, 2025);
            assert.equal(report.comparison_context.group_id, "general_contractor");
            assert.equal(report.comparison_context.group_label, "건설사");
          }
          assert.equal(reportMetricByYear(samsungReport, 2025, "revenue").raw_krw, 40742240967149);
          assert.equal(reportMetricByYear(samsungReport, 2025, "operating_profit").raw_krw, 3292747495925);
          assert.equal(reportMetricByYear(samsungReport, 2025, "operating_cash_flow").raw_krw, 3023741373868);
          assert.equal(reportMetricByYear(hyundaiReport, 2025, "revenue").raw_krw, 13896504000000);
          assert.equal(reportMetricByYear(hyundaiReport, 2025, "operating_profit").raw_krw, 277859000000);
          assert.equal(reportMetricByYear(hyundaiReport, 2025, "operating_cash_flow").raw_krw, -987129000000);
          assert.equal(reportMetricByYear(dlReport, 2025, "revenue").raw_krw, 7402425126660);
          assert.equal(reportMetricByYear(dlReport, 2025, "operating_profit").raw_krw, 386953267819);
          assert.equal(reportMetricByYear(dlReport, 2025, "operating_cash_flow").raw_krw, 232139885997);
          for (const report of [gsReport, samsungReport, hyundaiReport, dlReport]) {
            const peers = new Map(report.peer_benchmarks.map((row) => [row.metric_id, row]));
            for (const metricId of ["revenue", "operating_margin_pct", "operating_cash_flow", "liabilities_to_equity_pct"]) {
              const benchmark = peers.get(metricId);
              assert.ok(benchmark, `${metricId} benchmark should exist for all general contractors`);
              assert.equal(benchmark.comparable, true, `${metricId} should be comparable across four general contractors`);
              assert.equal(benchmark.peer_count, 4);
              assert.equal(benchmark.other_peer_count, 3);
              assert.equal(benchmark.comparison_group_id, "general_contractor");
              assert.equal(benchmark.comparison_financial_scope, "consolidated");
            }
            const borrowings = peers.get("total_borrowings");
            assert.ok(borrowings);
            assert.equal(borrowings.comparable, false, "incomplete borrowing-note coverage must not be forced into a peer ranking");
            assert.ok(borrowings.peer_count < 3);
            const receivables = peers.get("receivables_to_revenue_pct");
            assert.ok(receivables);
            assert.equal(receivables.comparable, false, "pending gross receivables must not be forced into a peer ranking");
            assert.ok(receivables.peer_count < 3);
          }
          '''
          if anchor not in text:
              raise SystemExit('GS frontend anchor missing')
          path.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

      - name: Validate full 11-company View Model and peer groups
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('frontend/public/data/companies/company_report_insights.json').read_text(encoding='utf-8'))
          companies = payload['companies']
          assert len(companies) == 11, len(companies)
          by_id = {row['company_id']: row for row in companies}
          gc_ids = ['gs-ec', 'samsung-ct-construction', 'hyundai-engineering', 'dl-enc']
          expected = {
              'gs-ec': (12450347000000, 437809000000, 591530000000),
              'samsung-ct-construction': (40742240967149, 3292747495925, 3023741373868),
              'hyundai-engineering': (13896504000000, 277859000000, -987129000000),
              'dl-enc': (7402425126660, 386953267819, 232139885997),
          }
          for company_id in gc_ids:
              row = by_id[company_id]
              assert row['financial_scope'] == 'consolidated'
              assert row['available_years'] == [2023, 2024, 2025]
              assert row['comparison_context']['group_id'] == 'general_contractor'
              revenue, op, ocf = expected[company_id]
              assert row['latest_metrics']['revenue']['raw_krw'] == revenue
              assert row['latest_metrics']['operating_profit']['raw_krw'] == op
              assert row['latest_metrics']['operating_cash_flow']['raw_krw'] == ocf
              benchmarks = {item['metric_id']: item for item in row['peer_benchmarks']}
              for metric in ['revenue', 'operating_margin_pct', 'operating_cash_flow', 'liabilities_to_equity_pct']:
                  assert benchmarks[metric]['comparable'] is True, (company_id, metric, benchmarks[metric])
                  assert benchmarks[metric]['peer_count'] == 4
                  assert benchmarks[metric]['other_peer_count'] == 3
              assert benchmarks['total_borrowings']['comparable'] is False
              assert benchmarks['total_borrowings']['peer_count'] < 3
              assert benchmarks['receivables_to_revenue_pct']['comparable'] is False
              assert benchmarks['receivables_to_revenue_pct']['peer_count'] < 3
          # Samsung C&T source is company-wide consolidated reporting, never a construction-division-only claim.
          samsung = by_id['samsung-ct-construction']
          assert '연결대상 종속기업' in samsung['attribution']['reporting_entity']
          assert samsung['attribution']['modular_segment_revenue_disclosed'] is False
          print('Full 11-company contractor peer validation PASS')
          PY

      - name: Python regressions
        run: |
          python scripts/build_company_report_insights.py --check
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-11 --check
          python -m pytest -q
          python -m compileall scripts src

      - name: Frontend regressions
        working-directory: frontend
        run: |
          npm run test:companies
          npm run test:companies-detail
          npm run test:companies-comparison
          npm run test:companies-v2
          node scripts/test-company-financial-dashboard.mjs
          node scripts/test-company-financial-trend-grid.mjs
          node scripts/test-company-financial-four-factor-summary.mjs
          npm run lint
          npm run build

      - name: Diff and source protection checks
        run: |
          git diff --check
          git diff --exit-code origin/main...HEAD -- \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json \
            frontend/public/data/companies/companies.json \
            frontend/public/data/companies/company_intelligence_v2.json
          for company in samsung-ct-construction hyundai-engineering dl-enc; do
            if find "data/company_reports/${company}" -type f -iname '*.pdf' -print -quit | grep -q .; then
              echo "PDF must not be committed for ${company}"
              exit 1
            fi
          done

      - name: Commit remaining public contractor financials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            data/company_reports/samsung-ct-construction/audit_financials_2023_2025.json \
            data/company_reports/hyundai-engineering/audit_financials_2023_2025.json \
            data/company_reports/dl-enc/audit_financials_2023_2025.json \
            data/company_reports/company_data_coverage_snapshot.json \
            frontend/public/data/companies/company_report_insights.json \
            frontend/scripts/test-company-detail-ui.mjs \
            tests/test_company_data_coverage.py \
            tests/test_company_report_insights.py \
            tests/test_geogwang_audit_financials.py \
            tests/test_nrb_financial_source_reconciliation.py
          git diff --cached --check
          git commit -m "Promote remaining contractor OpenDART audit financials"
          git push origin HEAD:feat/general-contractor-dart-audit-financials-wave2
