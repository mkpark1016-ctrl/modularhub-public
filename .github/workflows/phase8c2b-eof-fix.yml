name: Phase 8C-2B EOF Fix

on:
  push:
    branches:
      - feat/audit-opinion-interpretation-notice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/audit-opinion-interpretation-notice
      - name: Normalize test file EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_company_report_insights.py')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit minimal whitespace fix
        run: |
          if git diff --quiet -- tests/test_company_report_insights.py; then
            echo "No EOF normalization needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_company_report_insights.py
          git commit -m "Normalize company report insight test EOF"
          git push origin HEAD:feat/audit-opinion-interpretation-notice
