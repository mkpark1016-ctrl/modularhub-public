name: Import Kumkang curated baseline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/import-kumkang-baseline.yml
      - config/companies/curated/kumkang-kind.json
      - scripts/import_curated_company_baseline.py
      - scripts/test_curated_company_import.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-kumkang-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'data/company-baseline-pilot-kumkang'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: data/company-baseline-pilot-kumkang
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize curated technology collection compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/import_curated_company_baseline.py')
          text = path.read_text(encoding='utf-8')
          old = '''    technology = company.setdefault("technology", {})
              patents = technology.setdefault("patents", [])
              for patent in curated.get("technology", {}).get("patents", []):
          '''
          old = old.replace('              ', '    ')
          new = '''    technology = company.get("technology")
              if technology is None:
                  technology = {}
                  company["technology"] = technology
              elif not isinstance(technology, dict):
                  raise RuntimeError("V1 company technology must be an object")
              patents = technology.setdefault("patents", [])
              curated_technology = curated.get("technology", [])
              if isinstance(curated_technology, dict):
                  technology_records = curated_technology.get("patents", [])
              elif isinstance(curated_technology, list):
                  technology_records = curated_technology
              else:
                  raise RuntimeError("Curated technology must be a list or object")
              for patent in technology_records:
          '''
          new = new.replace('              ', '    ')
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Updated importer to support list/object technology collections.')
          elif 'for patent in technology_records:' in text:
              print('Importer compatibility fix already present.')
          else:
              raise SystemExit('Expected technology import block was not found; refusing unsafe patch.')
          PY

      - name: Validate curated merge without writing
        id: precheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/import_curated_company_baseline.py --check > /tmp/kumkang-precheck.log 2>&1
          status=$?
          cat /tmp/kumkang-precheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload precheck failure report
        if: steps.precheck.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-precheck-failure
          path: /tmp/kumkang-precheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after precheck failure
        if: steps.precheck.outputs.status != '0'
        run: exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record protected public JSON hashes
        shell: bash
        run: |
          sha256sum \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json \
            > /tmp/protected-before.sha256

      - name: Run curated importer regression test
        run: python scripts/test_curated_company_import.py

      - name: Generate company JSON outputs
        run: python scripts/import_curated_company_baseline.py

      - name: Validate generated JSON syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('frontend/public/data/companies/companies.json'),
              Path('frontend/public/data/companies/company_intelligence_v2.json'),
          ]
          for path in paths:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'VALID JSON: {path}')
          PY

      - name: Run company and public-data validation
        id: backend_validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            python scripts/test_company_universe.py
            python scripts/validate_company_universe.py
            python scripts/test_public_json_export.py
          } > /tmp/kumkang-backend-validation.log 2>&1
          status=$?
          cat /tmp/kumkang-backend-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload backend validation failure report
        if: steps.backend_validation.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-backend-validation-failure
          path: /tmp/kumkang-backend-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after backend validation failure
        if: steps.backend_validation.outputs.status != '0'
        run: exit 1

      - name: Verify protected public JSON files are unchanged
        shell: bash
        run: |
          sha256sum -c /tmp/protected-before.sha256
          git diff --exit-code -- \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run company frontend tests
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set +e
          {
            npm run test:companies
            npm run test:companies-v2
            npm run test:companies-projects
            npm run test:companies-url
          } > /tmp/kumkang-frontend-tests.log 2>&1
          status=$?
          cat /tmp/kumkang-frontend-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend test failure report
        if: steps.frontend_tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-frontend-tests-failure
          path: /tmp/kumkang-frontend-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after frontend test failure
        if: steps.frontend_tests.outputs.status != '0'
        run: exit 1

      - name: Run lint and production build
        id: lint_build
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set +e
          {
            npm run lint
            npm run build
          } > /tmp/kumkang-lint-build.log 2>&1
          status=$?
          cat /tmp/kumkang-lint-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint and build failure report
        if: steps.lint_build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-lint-build-failure
          path: /tmp/kumkang-lint-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after lint or build failure
        if: steps.lint_build.outputs.status != '0'
        run: exit 1

      - name: Ensure only intended generated files changed
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              'scripts/import_curated_company_baseline.py',
              'frontend/public/data/companies/companies.json',
              'frontend/public/data/companies/company_intelligence_v2.json',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = []
          for line in output.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {unexpected}')
          print('Changed files:', changed)
          PY

      - name: Commit importer fix and generated company JSON files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/import_curated_company_baseline.py \
            frontend/public/data/companies/companies.json \
            frontend/public/data/companies/company_intelligence_v2.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Import Kumkang Kind curated company baseline"
            git push origin HEAD:data/company-baseline-pilot-kumkang
          fi
