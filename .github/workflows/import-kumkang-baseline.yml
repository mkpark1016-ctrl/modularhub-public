name: Import Kumkang curated baseline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-kumkang-baseline.yml
      - .github/workflows/qa-r1a-kumkang-facilities.yml
      - config/companies/curated/kumkang-kind.json
      - config/companies/curated/kumkang-kind-qa-r1a.json
      - scripts/import_curated_company_baseline.py
      - scripts/apply_kumkang_facility_qa_r1a.py
      - scripts/test_curated_company_import.py
      - frontend/src/App.jsx
      - frontend/scripts/test-company-insights.mjs
      - frontend/scripts/test-company-intelligence-v2.mjs
      - frontend/scripts/test-company-projects.mjs
      - frontend/scripts/test-company-facility-qa-r1a.mjs
      - frontend/public/data/companies/companies.json
      - frontend/public/data/companies/company_intelligence_v2.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-kumkang-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'data/company-baseline-pilot-kumkang'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: data/company-baseline-pilot-kumkang
          fetch-depth: 0

      - name: Record protected public JSON hashes
        shell: bash
        run: |
          sha256sum \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json \
            > /tmp/protected-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate curated importer without rewriting committed outputs
        shell: bash
        run: |
          set -o pipefail
          python scripts/import_curated_company_baseline.py --check 2>&1 | tee /tmp/kumkang-legacy-import-check.log
          python scripts/test_curated_company_import.py 2>&1 | tee -a /tmp/kumkang-legacy-import-check.log

      - name: Upload importer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-legacy-import-diagnostics
          path: /tmp/kumkang-legacy-import-check.log
          if-no-files-found: warn
          retention-days: 7

      - name: Reapply QA-R1A overlay as an idempotence check
        run: python scripts/apply_kumkang_facility_qa_r1a.py

      - name: Validate JSON syntax and company contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path('frontend/public/data/companies/companies.json'),
              Path('frontend/public/data/companies/company_intelligence_v2.json'),
              Path('config/companies/curated/kumkang-kind.json'),
              Path('config/companies/curated/kumkang-kind-qa-r1a.json'),
          ):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'VALID JSON: {path}')
          PY
          python scripts/test_company_universe.py
          python scripts/validate_company_universe.py
          python scripts/test_public_json_export.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run company regression, QA, lint and build
        working-directory: frontend
        shell: bash
        run: |
          node scripts/test-company-facility-qa-r1a.mjs
          npm run test:companies
          npm run test:companies-v2
          npm run test:companies-projects
          npm run test:companies-url
          npm run lint
          npm run build

      - name: Verify protected datasets and secret safety
        shell: bash
        run: |
          sha256sum -c /tmp/protected-before.sha256
          git diff --exit-code -- \
            frontend/public/data/business.json \
            frontend/public/data/news.json \
            frontend/public/data/meta.json

          if grep -R -n -E '(OPEN_DART_API_KEY|OPENDART_API_KEY|DART_API_KEY|NAVER_CLIENT_SECRET|DATA_GO_KR_SERVICE_KEY)=' \
            config/companies/curated/kumkang-kind.json \
            config/companies/curated/kumkang-kind-qa-r1a.json \
            scripts/import_curated_company_baseline.py \
            scripts/apply_kumkang_facility_qa_r1a.py \
            frontend/src/App.jsx \
            frontend/public/data/companies/companies.json \
            frontend/public/data/companies/company_intelligence_v2.json; then
            echo 'Secret-like assignment found.' >&2
            exit 1
          fi

      - name: Confirm generated data and UI are committed and drift-free
        shell: bash
        run: |
          set +e
          git diff -- \
            frontend/src/App.jsx \
            frontend/public/data/companies/companies.json \
            frontend/public/data/companies/company_intelligence_v2.json \
            > /tmp/kumkang-drift.diff
          diff_status=$?
          git status --short > /tmp/kumkang-status.txt

          cat /tmp/kumkang-drift.diff
          cat /tmp/kumkang-status.txt

          if [ "$diff_status" -ne 0 ] || [ -s /tmp/kumkang-drift.diff ] || [ -s /tmp/kumkang-status.txt ]; then
            echo 'Committed company outputs are not idempotent or the working tree contains unexpected changes.' >&2
            exit 1
          fi

          echo 'PASS: legacy importer is validation-only, QA-R1A is idempotent, and committed outputs are drift-free.'

      - name: Upload drift diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kumkang-drift-diagnostics
          path: |
            /tmp/kumkang-drift.diff
            /tmp/kumkang-status.txt
          if-no-files-found: warn
          retention-days: 7
