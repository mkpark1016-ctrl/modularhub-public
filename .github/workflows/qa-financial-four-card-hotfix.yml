name: QA Financial Four Card Hotfix

on:
  push:
    branches:
      - fix/financial-decision-four-card-contract
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-financial-four-card-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused hotfix
        run: python scripts/patch_financial_decision_four_card.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Four-card contract regression
        working-directory: frontend
        run: node scripts/test-company-financial-decision-four-card.mjs

      - name: Company detail regression
        working-directory: frontend
        run: npm run test:companies-detail

      - name: Company v2 regression
        working-directory: frontend
        run: npm run test:companies-v2

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit focused product changes
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/components/company/CompanyAuditFinancialPanel.jsx frontend/src/companyUiOverrides.css; then
            echo "No product patch to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/company/CompanyAuditFinancialPanel.jsx frontend/src/companyUiOverrides.css
          git commit -m "fix: restore four-card financial decision summary"
          git push origin HEAD:${GITHUB_REF_NAME}
