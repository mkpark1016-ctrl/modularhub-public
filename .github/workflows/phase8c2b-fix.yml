name: Phase 8C-2B Minimal Fix

on:
  push:
    branches:
      - feat/audit-opinion-interpretation-notice

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip phase8c2b-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/audit-opinion-interpretation-notice
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema
      - name: Apply minimal regression fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_company_report_insights.py')
          text = builder.read_text(encoding='utf-8')
          old = '        "audit_opinions": source_payload["audit_opinions"],\n        "disclosure_limitations": list(source_payload.get("disclosure_limitations") or []),\n        "auditors": sorted({doc["auditor"] for doc in source_documents.values()}),'
          new = '        "audit_opinions": source_payload["audit_opinions"],\n        **({"disclosure_limitations": list(source_payload.get("disclosure_limitations") or [])} if any(opinion.get("opinion") != "unqualified" for opinion in source_payload.get("audit_opinions") or []) else {}),\n        "auditors": sorted({doc["auditor"] for doc in source_documents.values()}),'
          if old not in text:
              raise SystemExit('builder target not found')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8')

          schema = Path('schemas/company_reports/company_report_insights_v1.schema.json')
          text = schema.read_text(encoding='utf-8')
          old = '        "audit_opinions": { "type": "array" },\n        "auditors": { "type": "array" },'
          new = '        "audit_opinions": { "type": "array" },\n        "disclosure_limitations": {\n          "type": "array",\n          "items": { "type": "string", "minLength": 1 }\n        },\n        "auditors": { "type": "array" },'
          if old not in text:
              raise SystemExit('schema target not found')
          schema.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_company_report_insights.py')
          text = tests.read_text(encoding='utf-8')
          old = '    payload = json.loads(OUTPUT.read_text(encoding="utf-8"))\n    company = next(row for row in payload["companies"] if row["company_id"] == "geogwang-enterprise")'
          new = '    payload = load_output()\n    company = next(row for row in payload["companies"] if row["company_id"] == "geogwang-enterprise")'
          if old not in text:
              raise SystemExit('pytest OUTPUT target not found')
          text = text.replace(old, new, 1)
          regression = '''\n\ndef test_audit_opinion_limitations_do_not_change_unqualified_company_semantics() -> None:\n    payload = load_output()\n    geogwang = next(row for row in payload["companies"] if row["company_id"] == "geogwang-enterprise")\n    assert geogwang["source_summary"]["disclosure_limitations"]\n    assert "disclosure_limitations" not in yuchang_company(payload)["source_summary"]\n    assert "disclosure_limitations" not in kumkang_company(payload)["source_summary"]\n'''
          if 'test_audit_opinion_limitations_do_not_change_unqualified_company_semantics' not in text:
              text = text.rstrip() + regression + '\n'
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate derived report insights
        run: python scripts/build_company_report_insights.py --base-ref origin/main
      - name: Run targeted regression tests
        run: python -m pytest -q tests/test_company_report_insights.py
      - name: Commit minimal fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase8c2b-fix.yml
          git add scripts/build_company_report_insights.py schemas/company_reports/company_report_insights_v1.schema.json tests/test_company_report_insights.py frontend/public/data/companies/company_report_insights.json
          git commit -m "Fix audit opinion insight regression [skip phase8c2b-fix]"
          git push origin HEAD:feat/audit-opinion-interpretation-notice
