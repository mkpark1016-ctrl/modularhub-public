name: Phase 8C-1B migration

on:
  push:
    branches: [feat/company-strategy-monitoring-ui]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/company-strategy-monitoring-ui
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded source migration
        run: python scripts/migrations/apply_phase_8c_1b.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run company strategy and monitoring regression test
        working-directory: frontend
        run: node scripts/test-company-strategy-monitoring.mjs

      - name: Run existing company tests
        working-directory: frontend
        run: |
          npm run test:companies
          npm run test:companies-comparison
          npm run test:companies-detail
          npm run test:companies-url
          npm run test:companies-activities

      - name: Lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Commit migrated application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/App.jsx \
            frontend/src/companyInsights.js \
            frontend/src/components/company/CompanyComparisonMvp.jsx \
            frontend/src/main.jsx \
            frontend/src/companyUiOverrides.css \
            frontend/scripts/test-company-strategy-monitoring.mjs
          git diff --cached --check
          git commit -m "Refine company strategy and monitoring UI"
          git push origin HEAD:feat/company-strategy-monitoring-ui
