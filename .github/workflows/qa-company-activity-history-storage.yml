name: Company Activity History Storage QA

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build_company_activity_history.py"
      - "scripts/validate_company_activity_history.py"
      - "tests/test_company_activity_history_builder.py"
      - "tests/test_company_activity_history_guard.py"
      - "frontend/src/companyActivities.js"
      - "frontend/src/components/company/CompanyDetailView.jsx"
      - "frontend/scripts/test-company-activities.mjs"
      - ".github/workflows/publish-company-activities.yml"
      - ".github/workflows/qa-company-activity-history-storage.yml"

permissions:
  contents: read

jobs:
  history-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Compile activity scripts
        run: python -m compileall scripts/build_company_activity_timeline.py scripts/build_company_activity_history.py scripts/validate_company_activity_publication.py scripts/validate_company_activity_history.py

      - name: Back up bounded activity snapshot
        run: cp frontend/public/data/companies/company-activities.json "$RUNNER_TEMP/company-activities-baseline.json"

      - name: Build bounded snapshot and long-term history
        run: |
          python scripts/build_company_activity_timeline.py
          python scripts/build_company_activity_history.py

      - name: Validate bounded snapshot
        run: |
          python scripts/validate_company_activity_publication.py \
            --candidate frontend/public/data/companies/company-activities.json \
            --companies frontend/public/data/companies/companies.json \
            --baseline "$RUNNER_TEMP/company-activities-baseline.json"

      - name: Validate long-term history
        run: |
          python scripts/validate_company_activity_history.py \
            --history-index frontend/public/data/companies/company-activity-history-index.json \
            --history-dir frontend/public/data/companies/company-activity-history \
            --companies frontend/public/data/companies/companies.json \
            --snapshot frontend/public/data/companies/company-activities.json

      - name: Run Python activity regressions
        run: |
          python scripts/test_company_activity_timeline.py
          python -m pytest -q \
            tests/test_company_activity_publication_guard.py \
            tests/test_company_activity_history_builder.py \
            tests/test_company_activity_history_guard.py

      - name: Verify generated long-term history files
        run: |
          test -s frontend/public/data/companies/company-activity-history-index.json
          test -d frontend/public/data/companies/company-activity-history
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("frontend/public/data/companies/company-activity-history-index.json").read_text(encoding="utf-8"))
          assert index["companyCount"] == 11
          assert index["totalActivityCount"] > 0
          assert len(list(Path("frontend/public/data/companies/company-activity-history").glob("*.json"))) == 11
          print(f"history companies={index['companyCount']} activities={index['totalActivityCount']}")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend history fallback
        working-directory: frontend
        run: |
          npm ci
          npm run test:companies-activities
          npm run test:companies-detail
          npm run test:companies-url
          npm run test:companies
          npm run test:companies-v2
          npm run lint
          npm run build

      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
