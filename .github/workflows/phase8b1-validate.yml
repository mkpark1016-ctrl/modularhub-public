name: Validate Phase 8B-1 implementation

on:
  push:
    branches:
      - fix/company-type-first-discovery-and-financial-comparison

permissions:
  contents: write

env:
  CI: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh derived coverage artifacts
        run: python scripts/build_company_data_coverage.py --as-of-date 2026-08-09

      - name: Remove temporary validation workflow and commit derived artifacts
        run: |
          rm .github/workflows/phase8b1-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Refresh company coverage after segmented financial comparison"
            git push origin HEAD:fix/company-type-first-discovery-and-financial-comparison
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate builders
        run: |
          python scripts/build_company_report_insights.py --base-ref origin/main --check
          python scripts/build_company_data_coverage.py --as-of-date 2026-08-09 --check

      - name: Python tests
        run: |
          python -m pytest -q tests/test_company_report_insights.py
          python -m pytest -q
          python -m compileall scripts src

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm run test:companies
          npm run test:companies-detail
          npm run test:companies-comparison
          npm run test:companies-url
          npm run test:companies-v2
          npm run test:companies-projects
          npm run test:business
          npm run test:news
          npm run lint
          npm run build
          npm run qa:browser
          npm run qa:company-intelligence-workspace

      - name: Diff quality
        run: git diff --check origin/main...HEAD
