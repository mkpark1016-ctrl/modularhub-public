name: Materialize Working Capital Decision UI

on:
  push:
    branches:
      - refactor/general-contractor-working-capital-decision-ui

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[ui-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply working-capital decision refactor
        run: python scripts/_apply_working_capital_decision_refactor.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Rebuild financial insight View Model
        run: python scripts/build_company_report_insights.py --base-ref origin/main
      - name: Python regressions
        run: |
          python -m pytest -q \
            tests/test_company_working_capital_semantics.py \
            tests/test_company_report_insights.py \
            tests/test_company_audit_financials.py \
            tests/test_general_contractor_receivable_reconciliation.py
          python scripts/build_company_report_insights.py --check --base-ref origin/main
          python -m compileall scripts src
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend regressions, lint and build
        working-directory: frontend
        run: |
          npm ci
          node scripts/test-company-financial-working-capital-ui.mjs
          npm run test:companies-detail
          npm run test:companies-v2
          npm run lint
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build_company_report_insights.py \
            frontend/src/components/company/CompanyAuditFinancialPanel.jsx \
            frontend/public/data/companies/company_report_insights.json \
            tests/test_company_report_insights.py
          git commit -m "refactor: separate working capital from receivables burden [ui-materialized]"
          git push origin HEAD:refactor/general-contractor-working-capital-decision-ui
